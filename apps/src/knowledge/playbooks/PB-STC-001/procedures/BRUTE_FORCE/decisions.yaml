# decisions.yaml — human decision points embedded in this procedure's steps.
#
# A decision here is ALWAYS made by a person (IR/SOC), never by AI — the
# AI only surfaces the question and the evidence behind it. `decidedBy`
# names who is allowed to answer it; the actual answer + who + when + why
# is recorded on the Response Plan instance (decision, decision_by,
# decision_at, decision_reason), never in this template.

procedureCode: BRUTE_FORCE

decisions:
  - id: DEC-BF-001
    stepRef: 1
    question: "Was the successful login authorized?"
    context: >
      Shown after Step 1 (Confirm & Scope) once a successful login has
      been identified among the failed attempts.
    options:
      - value: "YES"
        label: "Yes — authorized user"
        leadsTo: CONTINUE_MONITORING
      - value: "NO"
        label: "No — unauthorized login"
        leadsTo: ACCOUNT_COMPROMISE_INVESTIGATION
    decidedBy: IR_TEAM
    recordFields: [decision, decision_by, decision_at, decision_reason]

  - id: DEC-BF-002
    stepRef: 4
    question: "Was the same source IP or pattern found on other hosts?"
    context: >
      Shown after Step 4 (Threat Hunting) once the fleet-wide re-hunt
      results are available.
    options:
      - value: "YES"
        label: "Yes — spread confirmed"
        leadsTo: EXPAND_SCOPE_NEW_RESPONSE_PLAN
      - value: "NO"
        label: "No — single host/account"
        leadsTo: CONTINUE_ERADICATION
    decidedBy: IR_TEAM
    recordFields: [decision, decision_by, decision_at, decision_reason]
