# steps.yaml - ORDERED CONTAINMENT PROCEDURE TEMPLATE for BRUTE_FORCE, not a runtime instance.
# The backend (apps/backend/src/infrastructure/knowledge/ContainmentProcedureLoader.ts) loads it into the
# RecommendationContext; ai-orchestrator runbook/procedure_loader.py reads the same file.
# Each recommendedAction item is one of three kinds:
#   ACTION  "... (see containment.yaml: <ACTION CODE>)"  - a catalog Action; its condition lives in containment.yaml
#   MANUAL  "... (manual - outside the VIGIX Action Catalog[; requires <who> approval])" - a control VIGIX cannot execute
#   CHECK   anything else - an investigation / decision step, never an executable Action
# Per-step status lives on the Recommendation / Response Plan, never here.

procedureCode: BRUTE_FORCE
steps:
- stepOrder: 1
  phase: VALIDATE
  title: Identify Source & Target
  objective: Identify the attacking source and every targeted account from the authentication logs.
  recommendedAction:
  - Review failed authentication events and identify the source IP and every targeted account
  - Confirm the pattern is brute force (many failures from one source in a short window), not ordinary failed logins
  - Check the source IP reputation and whether it belongs to trusted infrastructure
  reason: Containment must target the right source and accounts; a trusted scanner or shared address must not be blocked by
    mistake.
  evidenceRequired:
  - Authentication logs
  - Source IP
  - Target account
  expectedResult: Source IP and targeted account(s) identified; brute-force pattern confirmed or ruled out.
  responsibleRole: IR_TEAM
  responsibleDuty: IR Analyst
  approvalRequired: false
- stepOrder: 2
  phase: SELECT_ACTION
  title: Restrict Authentication Abuse
  objective: Stop further authentication attempts from the confirmed malicious source.
  recommendedAction:
  - 'Add the confirmed malicious source IP to a temporary block list of the firewall / WAF / IdP (see containment.yaml: ACT-BLOCK-SOURCE-IP)'
  - 'Apply a rate limit / account lockout threshold according to policy while attempts continue (see containment.yaml: ACT-RATE-LIMIT-SOURCE)'
  reason: Restricting the source stops the guessing while the outcome of the attempts is checked.
  evidenceRequired:
  - Source IP
  - Authentication logs
  expectedResult: Further attempts from the source are blocked or throttled.
  responsibleRole: IR_TEAM
  responsibleDuty: IR Engineer
  approvalRequired: true
  approvalRole: IR_TEAM
- stepOrder: 3
  phase: ASSESS
  title: Successful Authentication Check
  objective: Determine whether any attempt succeeded after the failures.
  recommendedAction:
  - Check for a successful login after the failed attempts for each targeted account
  - Review the activity of any session that succeeded (new sessions, password / MFA changes)
  reason: A successful login after many failures turns the incident into a possible account takeover.
  evidenceRequired:
  - Authentication logs
  - Session history
  expectedResult: Each targeted account is classified as compromised or not compromised.
  decisionRef: DEC-BF-001
  responsibleRole: IR_TEAM
  responsibleDuty: IR Analyst
  approvalRequired: false
- stepOrder: 4
  phase: SELECT_ACTION
  title: Protect Targeted Account
  objective: Remove attacker access from an account that was logged into.
  # Evidence-gated: failed logins alone never reach this step. It opens only when the evidence records a successful
  # login, and then also starts the Account Compromise response (escalatesTo).
  appliesWhenSignals: [SUCCESSFUL_LOGIN]
  escalatesTo: ACCOUNT_COMPROMISE
  conditionalActions: true
  recommendedAction:
  - Treat the incident as a possible Account Compromise and continue with that response - post-login activity, MFA / recovery changes and privilege changes of the account
  - 'Revoke the account''s active sessions / tokens (see containment.yaml: ACT-REVOKE-SESSION)'
  - 'Reset the account''s credential (see containment.yaml: ACT-RESET-CREDENTIAL)'
  - 'Disable the account until the reset is confirmed (see containment.yaml: ACT-DISABLE-ACCOUNT)'
  reason: Blocking the source does not revoke a session or a password the attacker already holds.
  evidenceRequired:
  - Target account
  - Successful authentication event
  expectedResult: No attacker session or valid credential remains for the account.
  responsibleRole: IR_TEAM
  responsibleDuty: IR Engineer
  approvalRequired: true
  approvalRole: IR_TEAM
- stepOrder: 5
  phase: ASSESS
  title: Scope Check
  objective: Find continued attempts and other targeted accounts or hosts.
  recommendedAction:
  - Search for continued attempts from the source and from new sources against the same accounts
  - Check whether other accounts or hosts were targeted by the same source or pattern
  reason: Brute-force campaigns rotate sources and accounts; scope decides whether a new response plan is needed.
  evidenceRequired:
  - Wazuh cross-host search results
  expectedResult: Confirmed list of sources, accounts and hosts involved.
  decisionRef: DEC-BF-002
  responsibleRole: IR_TEAM
  responsibleDuty: IR Analyst
  approvalRequired: false
- stepOrder: 6
  phase: VERIFY
  title: Verify Containment
  objective: Confirm unauthorized authentication has stopped and the account stays protected.
  recommendedAction:
  - Run the re-hunt query defined in verification.yaml
  - Monitor authentication of the targeted account(s) and the source IP
  reason: Containment is complete only when the success criteria in verification.yaml hold; NOT_RESOLVED reopens the investigation
    for a human decision.
  evidenceRequired:
  - Wazuh re-hunt results (before/after)
  expectedResult: RESOLVED or NOT_RESOLVED, per verification.yaml.
  responsibleRole: IR_TEAM
  responsibleDuty: IR Analyst
  approvalRequired: false
