# containment.yaml - CATALOG of candidate containment Actions for BRUTE_FORCE, not a fixed sequence.
# actionCode / runbookRef are the real Action Catalog codes (actions / runbooks tables) and equal the
# allowedActions of the DB playbook PB-SSH-BRUTEFORCE. `condition` is the evidence-backed precondition IR must confirm before
# the Action is executed; a Recommendation step for the Action must carry it. impactLevel / approvalRequired are
# the catalog defaults - the Policy Engine decides the final requirement, and every Response Ticket still needs
# the IR_TEAM decision.

procedureCode: BRUTE_FORCE
candidateActions:
- actionCode: ACT-BLOCK-SOURCE-IP
  name: Block Source IP
  condition: The source IP is confirmed malicious (brute-force pattern from one source) and is not trusted infrastructure
    or a shared NAT / proxy address.
  runbookRef: RB-BLOCK-SOURCE-IP
  impactLevel: MEDIUM
  approvalRequired: false
- actionCode: ACT-RATE-LIMIT-SOURCE
  name: Rate-Limit Source
  condition: Repeated authentication attempts from the source continue, or the source cannot be blocked outright (shared address).
  runbookRef: RB-RATE-LIMIT-SOURCE
  impactLevel: LOW
  approvalRequired: false
- actionCode: ACT-REVOKE-SESSION
  name: Revoke Active Sessions / Tokens
  condition: A successful login or an active suspicious session from the attacking source is confirmed for the targeted account.
  runbookRef: RB-REVOKE-SESSION
  impactLevel: MEDIUM
  approvalRequired: false
- actionCode: ACT-RESET-CREDENTIAL
  name: Reset User Credentials
  condition: Credential compromise of the targeted account is confirmed (a successful login the user did not make).
  runbookRef: RB-RESET-CREDENTIAL
  impactLevel: HIGH
  approvalRequired: true
  approvalRole: IR_TEAM
- actionCode: ACT-DISABLE-ACCOUNT
  name: Disable User Account
  condition: Account compromise is confirmed and the account must stay unusable until the credential reset is complete.
  runbookRef: RB-DISABLE-ACCOUNT
  impactLevel: HIGH
  approvalRequired: true
  approvalRole: IR_TEAM
