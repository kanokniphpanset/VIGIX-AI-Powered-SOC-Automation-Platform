    tool_variants: *neutral
    required_authority: [ir_execute, change_approval]
    operational_impact: "ผู้ใช้ภายนอกเห็นข้อความ error ทั่วไป; ทีมพัฒนาต้องใช้ internal log เพื่อ debug"
    ordered_steps:
      - step_id: S1
        origin: EXPANDED_FROM_REFERENCE
        fold: true
        instruction: "ยืนยันว่า handler {{response_handler.handler_or_path}} ของ {{response_handler.application}} ส่ง DB error ออกภายนอกจริง และ error นั้นผูกกับ request ที่สงสัย"
        expected_result: "รู้จุดที่เผย error"
        verify: "response ตัวอย่างผูกกับ evidence ref"
        on_failure: "ไม่เปลี่ยน; ไป investigation"
      - step_id: S2
        title: "เปลี่ยน external response ของ {{response_handler.handler_or_path}} เป็นข้อความทั่วไป"
        origin: EXPANDED_FROM_REFERENCE
        instruction: "เปลี่ยน external response ของ {{response_handler.handler_or_path}} เป็นข้อความทั่วไป โดยคง internal error logging ไว้เต็มรูปแบบ"
        method: "แก้ response handler {{response_handler.handler_or_path}} ให้ส่งข้อความผิดพลาดทั่วไปออกภายนอก โดยคง internal error logging ไว้เต็มรูปแบบ ทำผ่าน change control ขององค์กรและทดสอบก่อน แล้วทดสอบ request เดิมว่า response ภายนอกเป็นข้อความทั่วไปและ internal log ยังบันทึก error"
        method_basis: NEUTRAL_DERIVED
        expected_result: "response ภายนอกไม่มีรายละเอียด DB"
        verify: "ทดสอบ request เดิม: response ภายนอกเป็นข้อความทั่วไป และ internal log ยังบันทึก error"
        on_failure: "ใช้ response filter ที่ reverse proxy/WAF แทน และ escalate เจ้าของแอป"
        rollback: "คืนค่าเดิมจาก snapshot (ไม่แนะนำให้คืน)"
        impact: "การ debug จากภายนอกทำไม่ได้"
      - step_id: S3
        title: "จำกัด requests ที่ probing ผ่าน {{web_route.route}} / {{web_route.parameter}}"
        origin: EXPANDED_FROM_REFERENCE
        instruction: "จำกัด malicious requests ที่ probing ผ่าน {{web_route.route}} / {{web_route.parameter}} ด้วย targeted rule ที่ {{web_route.control_point}}"
        method: "เพิ่ม targeted rule ที่ {{web_route.control_point}} เฉพาะ {{web_route.route}} / {{web_route.parameter}} เพื่อจำกัด request ที่ probing เริ่มในโหมด detect/log เทียบกับ traffic ปกติ แล้วเปลี่ยนเป็น block หลังผ่านการตรวจและได้รับอนุมัติตามที่องค์กรกำหนด ตรวจว่า log แสดงการจำกัดตาม pattern และอัตรา error ของ route ปกติไม่เพิ่ม"
        method_basis: NEUTRAL_DERIVED
        condition: {all_of: [{field: targets.web_route.validated, operator: equals, value: true}]}
        expected_result: "probing ถูกจำกัด"
        verify: "WAF log แสดง block และ traffic ปกติไม่กระทบ"
        on_failure: "ทดสอบแบบ detect/log ก่อนเปิด block"
        rollback: "ถอน rule จาก snapshot"
      - step_id: S4
        kind: verify
        origin: EXPANDED_FROM_REFERENCE
        instruction: "ตรวจว่าไม่มี DB error ใน external response ใหม่ และ internal log ยังได้รับ error"
        expected_result: "ไม่มี leakage ใหม่"
        verify: "re-hunt response ภายนอกด้วย pattern error"
        on_failure: "ตรวจ handler อื่นที่เผย error"
    verification: ["external response ไม่เผย DB error", "internal logging ยังทำงาน"]
    failure_handling: ["พบ handler อื่นเผย error → เพิ่มเฉพาะ handler ที่มีหลักฐาน"]
    rollback: ["คืน response handler จาก snapshot ตาม change approval"]
    remediation_followups: ["จัดการ exception ที่ชั้น application อย่างถาวรและแก้โค้ดที่ทำให้ query ผิดพลาด (remediation แยกจาก containment)"]

  - runbook_id: RB-SQLI-PROBING-RESTRICT
