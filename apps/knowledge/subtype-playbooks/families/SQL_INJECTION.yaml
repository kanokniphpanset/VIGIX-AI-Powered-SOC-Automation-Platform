runbooks:
  - runbook_id: RB-WEB-REQUEST-RESTRICT
    review_status: IR_REVIEW_PENDING
    supported_action_ids: [ACT-WEB-REQUEST-RESTRICT]
    supported_subtypes: [SQ-UNION]
    objective: "จำกัด injection path ต่อ route/parameter/source/session ด้วย targeted WAF/virtual patch และ scoped rate-limit ตาม approved control"
    prerequisites: ["route/parameter ที่ correlated กับ requests อันตราย", "ตัวอย่าง traffic ปกติของ route เพื่อทดสอบ rule", "approved change สำหรับ rule"]
    required_evidence: [sq_union_requests_correlated]
    required_targets: [web_route]
    required_capabilities: [cap.waf_targeted_rule, cap.config_snapshot]
    tool_variants: *neutral
    required_authority: [ir_execute, change_approval]
    operational_impact: "rule ที่แคบเกินไปอาจพลาด, กว้างไปอาจบล็อก traffic ปกติ — ต้องทดสอบก่อนบล็อกจริง"
    ordered_steps:
      - step_id: S1
        origin: EXPANDED_FROM_REFERENCE
        fold: true
        instruction: "ยืนยันว่า {{web_route.route}} / พารามิเตอร์ {{web_route.parameter}} ของ {{web_route.application}} ถูกใช้ใน requests ที่ correlated กับ response/DB behavior ผิดปกติ (ไม่ใช่เห็นเพียง keyword)"
        expected_result: "route/parameter ถูกต้องตามหลักฐาน"
        verify: "request ตัวอย่างและ response ผูกกับ evidence ref"
        on_failure: "ไม่สร้าง rule; คงสถานะ NEEDS_EVIDENCE"
      - step_id: S2
        origin: EXPANDED_FROM_REFERENCE
        fold: true
        instruction: "บันทึกค่า rule/rate-limit ปัจจุบันของ {{web_route.application}} ที่ {{web_route.control_point}} ก่อนแก้"
        condition: {all_of: [{field: capability.cap.config_snapshot.supported, operator: equals, value: true}]}
        expected_result: "มี snapshot"
        verify: "snapshot ใน incident record"
        on_failure: "บันทึกด้วยมือ"
      - step_id: S3
        title: "เพิ่ม targeted rule ที่ {{web_route.control_point}} สำหรับ {{web_route.route}} / {{web_route.parameter}}"
        origin: EXPANDED_FROM_REFERENCE
        instruction: "เพิ่ม targeted rule (virtual patch) ที่ {{web_route.control_point}} เฉพาะ {{web_route.route}} / {{web_route.parameter}} ให้ตรวจ pattern UNION injection — ทดสอบแบบ detect/log กับ traffic ปกติก่อน แล้วจึงเปลี่ยนเป็น block ตาม approved control"
        method: "เพิ่ม targeted rule ที่ {{web_route.control_point}} เฉพาะ {{web_route.route}} / {{web_route.parameter}} ให้ตรวจ pattern UNION injection เริ่มในโหมด detect/log เทียบกับ traffic ปกติ แล้วเปลี่ยนเป็น block หลังผ่านการตรวจและได้รับอนุมัติตามที่องค์กรกำหนด ตรวจว่า log แสดงการจำกัดตาม pattern และอัตรา error ของ route ปกติไม่เพิ่ม"
        method_basis: NEUTRAL_DERIVED
        expected_result: "requests อันตรายถูกบล็อกโดย traffic ปกติไม่ถูกกระทบ"
        verify: "WAF log แสดง block ของ pattern ที่ระบุ และอัตรา error ของ route ปกติไม่เพิ่ม"
        on_failure: "คงโหมด detect/log และ escalate เจ้าของแอปพลิเคชัน"
        rollback: "ถอน rule จาก snapshot"
        impact: "ถ้า rule กว้างเกินไป อาจบล็อก request ปกติของ route นี้"
      - step_id: S4
        title: "ตั้ง scoped rate-limit บน {{web_route.route}} สำหรับ source scope {{web_route.source_scope}}"
        origin: EXPANDED_FROM_REFERENCE
        instruction: "ตั้ง scoped rate-limit บน {{web_route.route}} สำหรับ source scope {{web_route.source_scope}} (ตามที่พบใน evidence ไม่ใช่ทั้งแอป)"
        method: "ตั้ง rate-limit เฉพาะ {{web_route.route}} สำหรับ source scope {{web_route.source_scope}} ตามที่พบในหลักฐาน (ไม่ใช่ทั้งแอป) ที่ web control ที่ใช้ได้ บันทึกค่าเดิมก่อนแก้ แล้วตรวจจาก log ว่า request rate จาก scope ลดลง"
        method_basis: NEUTRAL_DERIVED
        condition: {all_of: [{field: capability.cap.waf_targeted_rule.supported, operator: equals, value: true}]}
        expected_result: "ความถี่ของ requests จาก scope ที่ระบุถูกจำกัด"
        verify: "request rate จาก scope ลดลงตาม log"
        on_failure: "ปรับตาม evidence ใหม่"
        rollback: "ถอน rate-limit จาก snapshot"
      - step_id: S5
        kind: verify
        origin: EXPANDED_FROM_REFERENCE
        instruction: "ตรวจ WAF/web/DB log หลังใช้ rule ว่าไม่มี UNION request ใหม่ผ่านไปถึง application และ response ไม่ผิดปกติ"
        expected_result: "ไม่มี request อันตรายผ่าน"
        verify: "re-hunt route/parameter ในช่วงเฝ้าระวัง"
        on_failure: "ตรวจ route/parameter อื่นที่มี evidence"
    verification: ["requests อันตรายถูกบล็อกที่ route/parameter ที่ระบุ", "traffic ปกติไม่ถูกกระทบ"]
    failure_handling: ["ผู้โจมตีย้าย route/parameter → เพิ่มเฉพาะที่มีหลักฐาน ไม่ global block"]
    rollback: ["ถอน rule/rate-limit จาก snapshot"]
    remediation_followups: ["แก้โค้ดให้ใช้ parameterized queries และ input validation ที่ route/parameter นี้ (remediation แยกจาก containment)"]

  - runbook_id: RB-DB-ERROR-EXPOSURE-CONTAIN
    review_status: IR_REVIEW_PENDING
    supported_action_ids: [ACT-DB-ERROR-EXPOSURE-CONTAIN]
    supported_subtypes: [SQ-ERROR]
    objective: "ใช้ generic external response โดยคง internal logging แล้วจำกัด malicious requests"
    prerequisites: ["handler/request path ที่เผย DB error", "ตัวอย่าง response ที่เผย error (ไม่แสดงใน recommendation)"]
    required_evidence: [sq_db_error_exposed]
    required_targets: [response_handler]
