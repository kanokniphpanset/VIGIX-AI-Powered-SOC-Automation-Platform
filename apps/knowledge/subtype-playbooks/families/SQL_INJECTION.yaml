        method: "สั่ง pause consumer/job {{stored_record_pipeline.consumer_or_job_id}} และ retry/ตารางรันของมัน (เฉพาะตัวนี้) บันทึกสถานะก่อน แล้วตรวจว่าไม่มีการรัน"
