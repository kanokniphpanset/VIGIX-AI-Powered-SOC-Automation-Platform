        needs_prior: [S3]
        expected_result: "งานปกติดำเนินต่อโดยไม่แตะ records ที่ถูกกัน"
        verify: "job ทำงานและไม่ประมวลผล records ที่ hold"
        on_failure: "คง pause ไว้จนกว่าจะยืนยันการยกเว้นได้"
      - step_id: S5
        kind: verify
        origin: EXPANDED_FROM_REFERENCE
        instruction: "ตรวจ DB log ว่าไม่มี query อันตรายจาก job นี้อีก"
        expected_result: "ไม่มี query ซ้ำ"
        verify: "re-hunt query pattern จาก job"
        on_failure: "ตรวจ records/queue อื่นที่มี lineage"
    verification: ["job ไม่ก่อ query อันตรายอีก", "records ต้นฉบับครบ"]
