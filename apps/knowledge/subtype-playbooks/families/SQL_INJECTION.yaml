  - runbook_id: RB-SQLI-TIMING-CONTAIN
    review_status: IR_REVIEW_PENDING
    supported_action_ids: [ACT-SQLI-TIMING-CONTAIN]
    supported_subtypes: [SQ-TIME]
    objective: "จำกัด request path และให้ DBA cancel query/session ที่ระบุเมื่อเข้าเงื่อนไข"
    prerequisites: ["correlation request ↔ query/session id", "DBA/เจ้าของ DB platform ที่ติดต่อได้"]
    required_evidence: [sq_time_query_correlation]
    required_targets: []
    required_capabilities: [cap.waf_targeted_rule, cap.db_query_cancel]
    tool_variants: *neutral
    required_authority: [ir_execute, dba]
    operational_impact: "การ cancel query ที่ระบุอาจทำให้ transaction ที่เกี่ยวข้อง rollback"
    ordered_steps:
      - step_id: S1
        origin: EXPANDED_FROM_REFERENCE
        fold: true
        instruction: "ยืนยันว่า request กับ query/session {{db_query_job.query_or_session_id}} ({{db_query_job.platform}} / {{db_query_job.database}}) สัมพันธ์กันตามเวลาและ workload ที่เป็นอันตราย (response ช้าอย่างเดียวไม่พอ)"
        condition: {all_of: [{field: targets.db_query_job.validated, operator: equals, value: true}]}
        expected_result: "query ที่ต้อง cancel ถูกระบุเป็นรายการเดียว"
        verify: "query id ผูกกับ request ใน evidence"
        on_failure: "ไม่ cancel; ไป investigation"
      - step_id: S2
        title: "จำกัด request path {{web_route.route}} / {{web_route.parameter}}"
        origin: EXPANDED_FROM_REFERENCE
        instruction: "จำกัด request path {{web_route.route}} / {{web_route.parameter}} ด้วย targeted rule/rate-limit ที่ {{web_route.control_point}} เพื่อไม่ให้ query ใหม่ถูกสร้าง"
        method: "จำกัด request path {{web_route.route}} / {{web_route.parameter}} ด้วย targeted rule หรือ rate-limit ที่ {{web_route.control_point}} เพื่อไม่ให้ query ใหม่ถูกสร้าง บันทึกค่าเดิมก่อนแก้ แล้วตรวจจาก log ว่ามีการจำกัดและไม่มี query ใหม่"
        method_basis: NEUTRAL_DERIVED
        condition: {all_of: [{field: targets.web_route.validated, operator: equals, value: true}, {field: capability.cap.waf_targeted_rule.supported, operator: equals, value: true}]}
        expected_result: "requests ที่ทำให้เกิด query อันตรายถูกจำกัด"
        verify: "WAF log แสดง block/limit และ query ใหม่ไม่เกิด"
        on_failure: "escalate เจ้าของแอป"
        rollback: "ถอน rule จาก snapshot"
      - step_id: S3
        title: "ให้ DBA cancel query/session {{db_query_job.query_or_session_id}} บน {{db_query_job.database}}"
        origin: EXPANDED_FROM_REFERENCE
        manual_owner: dba
        instruction: "ขอให้ DBA ของ {{db_query_job.platform}} cancel เฉพาะ query/session {{db_query_job.query_or_session_id}} บนฐานข้อมูล {{db_query_job.database}} (ไม่ cancel ทุก slow query)"
        method: "ส่งให้ DBA ของ {{db_query_job.platform}}: ตัวระบุ query/session {{db_query_job.query_or_session_id}} ฐานข้อมูล {{db_query_job.database}} เวลาที่พบ และหลักฐานอ้างอิง ให้ DBA ยืนยันว่าตัวระบุตรงกับ query ที่ผิดปกติก่อน แล้ว cancel เฉพาะรายการนั้น (ไม่ cancel slow query อื่น) และแจ้งผลกลับ IR เพื่อบันทึกใน incident record"
        method_basis: NEUTRAL_DERIVED
        condition: {all_of: [{field: targets.db_query_job.validated, operator: equals, value: true}]}
        expected_result: "query/session ที่ระบุถูกยกเลิก"
        verify: "query id ไม่อยู่ในรายการ active ของ DB และ load กลับสู่ปกติ"
        on_failure: "escalate DBA lead และเฝ้าระวัง resource"
        impact: "transaction ที่เกี่ยวข้องกับ query นี้จะ rollback"
      - step_id: S4
        kind: verify
        origin: EXPANDED_FROM_REFERENCE
        instruction: "ตรวจว่าไม่มี query อันตรายใหม่จาก route เดิมและ DB load กลับสู่ระดับปกติ"
        expected_result: "ไม่มี workload อันตรายใหม่"
        verify: "re-hunt query/route ในช่วงเฝ้าระวัง"
        on_failure: "ตรวจ route/session อื่นที่มี evidence"
    verification: ["query ที่ระบุหยุดและไม่เกิดซ้ำ", "DB load ปกติ"]
    failure_handling: ["เกิด query ใหม่ → ระบุ query/session เพิ่มจากหลักฐาน ไม่ kill ทั้งหมด"]
    rollback: ["ถอน rule จาก snapshot (cancel query ย้อนกลับไม่ได้)"]
    remediation_followups: ["แก้โค้ดที่ทำให้ query ถูกสอดแทรกได้ (parameterized queries) เป็น remediation แยก"]

  - runbook_id: RB-DB-EGRESS-CONTAIN
    review_status: IR_REVIEW_PENDING
    supported_action_ids: [ACT-DB-EGRESS-CONTAIN]
    supported_subtypes: [SQ-OOB]
    objective: "ตัด egress ของ DB workload เฉพาะ destination/protocol ที่พบ ตัด connection เดิมที่เกี่ยวข้อง และจำกัด request path"
    prerequisites: ["DB host, destination, protocol, route ที่ผูกด้วย lineage", "รายการ destination ที่อนุมัติของ DB (replication/backup)"]
    required_evidence: [sq_request_query_egress_chain]
    required_targets: [db_egress]
    required_capabilities: [cap.egress_control, cap.connection_state_termination, cap.waf_targeted_rule, cap.config_snapshot]
    tool_variants: *neutral
    required_authority: [ir_execute]
    operational_impact: "จำกัดเฉพาะ egress ไป destination ที่ระบุ DB ยังให้บริการตามปกติ"
    ordered_steps:
      - step_id: S1
        origin: EXPANDED_FROM_REFERENCE
        fold: true
        instruction: "ยืนยันว่า outbound จาก {{db_egress.db_host_id}} ไป {{db_egress.destination}} ({{db_egress.protocol}}) เกิดขึ้นจริงและผูกกับ request/query ผ่าน route {{db_egress.route}} และไม่ใช่ destination ที่ DB ใช้อนุมัติ"
        expected_result: "outbound ที่ต้องตัดถูกต้องตามหลักฐาน"
        verify: "เทียบ flow log กับ lineage และรายการ approved destinations"
        on_failure: "ไม่ตัด; ไป investigation"
      - step_id: S2
        origin: EXPANDED_FROM_REFERENCE
        fold: true
        instruction: "บันทึกค่า egress rule ปัจจุบันของ {{db_egress.db_host_id}} ก่อนแก้"
        condition: {all_of: [{field: capability.cap.config_snapshot.supported, operator: equals, value: true}]}
        expected_result: "มี snapshot"
        verify: "snapshot ใน incident record"
        on_failure: "บันทึกด้วยมือ"
      - step_id: S3
        title: "จำกัด egress จาก {{db_egress.db_host_id}} ไป {{db_egress.destination}} ({{db_egress.protocol}})"
        origin: EXPANDED_FROM_REFERENCE
        instruction: "จำกัด egress จาก {{db_egress.db_host_id}} ไป {{db_egress.destination}} ({{db_egress.protocol}}) เท่านั้น (ไม่ isolate DB ทั้งเครื่อง)"
        method: "ตั้ง deny เฉพาะ flow จาก {{db_egress.db_host_id}} ไป {{db_egress.destination}} ({{db_egress.protocol}}) ที่จุดบังคับเครือข่ายซึ่งเห็น flow นี้จริง (ไม่ isolate DB ทั้งเครื่อง) บันทึก rule เดิมก่อนแก้ แล้วตรวจจาก log ว่า attempt ใหม่ถูกปฏิเสธ"
        method_basis: NEUTRAL_DERIVED
        expected_result: "DB เชื่อมต่อออก destination นี้ไม่ได้"
        verify: "flow log แสดง deny และไม่มี outbound ใหม่"
        on_failure: "escalate IR เพื่อจำกัดที่ segment ระดับ DB tier"
        rollback: "ถอน rule จาก snapshot"
        impact: "DB ติดต่อ destination นี้ไม่ได้ (rule จำกัดเฉพาะ destination ที่ระบุ)"
      - step_id: S4
        title: "ตัด connection เดิมจาก {{db_egress.db_host_id}} ไป {{db_egress.destination}}"
        origin: EXPANDED_FROM_REFERENCE
        instruction: "ตัด connections เดิมจาก {{db_egress.db_host_id}} ไป {{db_egress.destination}} ({{db_egress.protocol}}) ที่ยังค้างอยู่"
        method_basis: EXISTING
        needs_prior: [S3]
        requires_confirmed_tool: true
        method: "ใช้ความสามารถตัด connection state ของเครื่องมือ โดยระบุ flow จากต้นทาง {{db_egress.db_host_id}} ไปยัง {{db_egress.destination}} ({{db_egress.protocol}}) แล้วใช้ตัวระบุ connection ตามที่เครื่องมือแสดง ตัดเฉพาะ flow นี้ โดยตรวจรายการ connection ที่ค้างก่อนตัด บันทึกตัวระบุที่ตัด แล้วตรวจรายการซ้ำว่า flow นี้ไม่เหลือและ flow อื่นไม่ถูกตัด"
        condition: {all_of: [{field: capability.cap.connection_state_termination.supported, operator: equals, value: true}]}
        expected_result: "ไม่มี connection ค้าง"
        verify: "connection table ไม่แสดง flow {{db_egress.db_host_id}} → {{db_egress.destination}} ({{db_egress.protocol}})"
        on_failure: "เฝ้าระวังและ escalate IR"
      - step_id: S5
        title: "จำกัด request path {{web_route.route}} / {{web_route.parameter}} ที่ถูก inject"
        origin: EXPANDED_FROM_REFERENCE
        instruction: "จำกัด request path {{web_route.route}} / {{web_route.parameter}} ที่ inject ด้วย targeted rule ที่ {{web_route.control_point}}"
        method: "เพิ่ม targeted rule ที่ {{web_route.control_point}} เฉพาะ {{web_route.route}} / {{web_route.parameter}} เพื่อปิดเส้นทางที่ถูก inject เริ่มในโหมด detect/log เทียบกับ traffic ปกติ แล้วเปลี่ยนเป็น block หลังผ่านการตรวจและได้รับอนุมัติตามที่องค์กรกำหนด ตรวจว่า log แสดงการจำกัดตาม pattern และอัตรา error ของ route ปกติไม่เพิ่ม"
        method_basis: NEUTRAL_DERIVED
        condition: {all_of: [{field: targets.web_route.validated, operator: equals, value: true}]}
        expected_result: "request ที่ทำให้เกิด OOB ถูกจำกัด"
        verify: "WAF log แสดง block"
        on_failure: "escalate เจ้าของแอป"
        rollback: "ถอน rule จาก snapshot"
      - step_id: S6
        kind: verify
        origin: EXPANDED_FROM_REFERENCE
        instruction: "ตรวจว่าไม่มี outbound ใหม่จาก {{db_egress.db_host_id}} ไป {{db_egress.destination}} และ DB service ปกติ"
        expected_result: "ไม่มี egress ผิดปกติ"
        verify: "re-hunt flow ในช่วงเฝ้าระวัง"
        on_failure: "ตรวจ protocol/destination อื่นที่มี evidence"
    verification: ["ไม่มี outbound ใหม่ไป destination ที่ระบุ", "DB ให้บริการตามปกติ"]
    failure_handling: ["พบ destination ใหม่ → เพิ่มเฉพาะที่มี lineage"]
    rollback: ["ถอน egress rule จาก snapshot"]
    remediation_followups: ["ปิดความสามารถของ DB ที่เรียก network จาก query และแก้ query ให้ parameterized (remediation แยก)"]

  - runbook_id: RB-STORED-PAYLOAD-CONTAIN
