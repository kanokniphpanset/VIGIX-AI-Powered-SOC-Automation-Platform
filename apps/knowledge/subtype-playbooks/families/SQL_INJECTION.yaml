        expected_result: "records ที่ระบุไม่ถูกประมวลผล และต้นฉบับยังอยู่"
        verify: "queue ไม่มีสำเนา active และต้นฉบับยังอยู่"
        on_failure: "คง job ที่ pause ไว้และ escalate IR"
        rollback: "ปล่อย records กลับเมื่อ IR ยืนยัน"
