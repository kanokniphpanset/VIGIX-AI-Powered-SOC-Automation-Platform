    remediation_followups: ["แก้ consumer ให้ใช้ parameterized queries เมื่ออ่านข้อมูลที่เก็บไว้ (remediation แยกจาก containment)"]

  - runbook_id: RB-BATCH-QUERY-CONTAIN
