# SQL_INJECTION — family file. Reference: reference-registry.yaml#SQL_INJECTION
# Principles: SQL keyword/semicolon proves neither query execution nor data loss (SQ-P1); slow response alone never opens query termination (SQ-P2);
# OOB payload syntax does not prove outbound success (SQ-P3); never kill all slow queries / isolate the DB blanket (SQ-P4);
# second-order needs record->consumer/job->query lineage (SQ-P5); parameterized queries / code fixes are REMEDIATION, separate from containment (SQ-P6).
# OS command injection (request->app->shell) is NOT SQLi: it is handled by PROC-CHAIN (see SUSPICIOUS_PROCESS.yaml, PROC-P5).

family: SQL_INJECTION
defaults:
  neutral_tool_variants: &neutral
    - {variant_id: platform_neutral, tool: TOOL_MAPPING_REQUIRED, note: "Organization tool mapping MISSING; steps are role-level. WAF/DB product names, rule syntax and APIs are intentionally not invented."}
  prov: &prov {reference: SQL_INJECTION, registry_version: ref-2026-10-08, playbook_version: "2.0.0"}
  change_gate: &change_gate {all_of: [{field: authority.change_approval.granted, operator: equals, value: true}]}

evidence:
  - id: sq_keyword_or_syntax_only
    description: "SQL keyword / semicolon / payload syntax / slow response ONLY (indicator; no correlated request effect)."
    confirm: "หา request ที่ correlated กับ response/DB behavior จริง (error, ข้อมูลเพิ่ม, timing, query log)"
    may_be_authorized: false
  - id: sq_union_requests_correlated
    description: "Correlated malicious UNION-based requests on a route/parameter (same route/param/source/session pattern)."
    confirm: "ผูก request หลายรายการกับ route/parameter เดียวกันและดู response ที่ผิดปกติ (ไม่ใช่เห็นแค่คำว่า UNION)"
    may_be_authorized: false
  - id: sq_db_error_exposed
    description: "Request correlated with a database error exposed in the EXTERNAL response."
    confirm: "ตรวจ response ภายนอกที่มี DB error text และผูกกับ request/handler"
    may_be_authorized: false
  - id: sq_boolean_sequence_correlated
    description: "Request sequence with correlated response differences consistent with boolean-blind probing."
    confirm: "ตรวจลำดับ request (true/false condition) และความต่างของ response ที่สอดคล้องกัน ต่อ endpoint/session/campaign"
    may_be_authorized: false
  - id: sq_time_query_correlation
    description: "Timing correlation between requests and harmful DB query/session (not just a slow response)."
    confirm: "ผูก request กับ query/session id ใน DB log และดู duration/ผลต่อ workload"
    may_be_authorized: false
  - id: sq_request_query_egress_chain
    requires_lineage: true
    description: "Lineage request/query -> DB workload -> outbound activity (OOB)."
    confirm: "ผูก request/query กับ outbound connection/DNS จาก DB workload (ต้องมี outbound จริง ไม่ใช่เห็น syntax)"
    may_be_authorized: false
  - id: sq_second_order_lineage
    requires_lineage: true
    description: "Lineage record -> consumer/job -> harmful query (second-order)."
    confirm: "ระบุ record ที่ถูกเก็บ, consumer/job ที่อ่าน และ query อันตรายที่เกิด"
    may_be_authorized: false
  - id: sq_multi_statement_evidence
    description: "Driver/query evidence that multiple statements were accepted (stacked/batched)."
    confirm: "ตรวจ driver/DB log ว่า statement มากกว่าหนึ่งชุดถูก execute ผ่าน route นั้น"
    may_be_authorized: false

actions:
  - action_id: ACT-WEB-REQUEST-RESTRICT
    action_name: Restrict union-injection request path
    label_th: "จำกัดเส้นทาง request แบบ union injection"
    objective: "จำกัด injection path ต่อ route/parameter/source/session ที่เกี่ยวข้อง ด้วย targeted WAF/virtual patch และ scoped rate-limit ตาม approved control"
    phase: CONTAINMENT
    containment_stage: CLOSE_PATH
    impact_level: MEDIUM
    review_status: IR_REVIEW_PENDING
    supported_target_types: [web_route]
    evidence_requirements: [sq_union_requests_correlated]
    target_requirements: [web_route]
    runbook_refs: [RB-WEB-REQUEST-RESTRICT]
    legacy_action_refs: [ACT-BLOCK-SOURCE-IP, ACT-RATE-LIMIT-SOURCE]
    execution_constraints: ["targeted rule ทดสอบกับ traffic ปกติก่อน", "ไม่ global block", "code fix เป็น remediation แยก"]
  - action_id: ACT-DB-ERROR-EXPOSURE-CONTAIN
    action_name: Stop DB error leakage and limit probing
    label_th: "หยุดการรั่วของ DB error และจำกัดการสำรวจ"
    objective: "ใช้ generic external response โดยคง internal logging แล้วจำกัด malicious requests"
    phase: CONTAINMENT
    containment_stage: CLOSE_PATH
    impact_level: MEDIUM
    review_status: IR_REVIEW_PENDING
    supported_target_types: [response_handler, web_route]
    evidence_requirements: [sq_db_error_exposed]
    target_requirements: [response_handler, web_route]
    runbook_refs: [RB-DB-ERROR-EXPOSURE-CONTAIN]
    legacy_action_refs: [ACT-RATE-LIMIT-SOURCE]
    execution_constraints: ["ไม่ปิด internal logging", "code fix เป็น remediation แยก"]
  - action_id: ACT-SQLI-PROBING-RESTRICT
    action_name: Restrict boolean-blind probing
    label_th: "จำกัดการสำรวจแบบ boolean-blind"
    objective: "จำกัด probing ต่อ endpoint/session/campaign scope ด้วย tested input-path restriction และ scoped throttling ครอบคลุม distributed sources"
    phase: CONTAINMENT
    containment_stage: CLOSE_PATH
    impact_level: MEDIUM
    review_status: IR_REVIEW_PENDING
    supported_target_types: [web_route]
    evidence_requirements: [sq_boolean_sequence_correlated]
    target_requirements: [web_route]
    runbook_refs: [RB-SQLI-PROBING-RESTRICT]
    legacy_action_refs: [ACT-BLOCK-SOURCE-IP, ACT-RATE-LIMIT-SOURCE]
    execution_constraints: ["ครอบคลุม distributed sources ที่พบ ไม่ block IP เดียว", "tested input-path restriction"]
  - action_id: ACT-SQLI-TIMING-CONTAIN
    action_name: Contain time-blind probing and harmful query
    label_th: "จำกัดการสำรวจแบบ time-blind และ query ที่เป็นอันตราย"
    objective: "จำกัด request path และให้ DBA cancel query/session ที่ระบุเมื่อเข้าเงื่อนไข"
    phase: CONTAINMENT
    containment_stage: STOP_ACTIVE
    impact_level: HIGH
    review_status: IR_REVIEW_PENDING
    supported_target_types: [web_route, db_query_job]
    evidence_requirements: [sq_time_query_correlation]
    target_requirements: [web_route, db_query_job]
    runbook_refs: [RB-SQLI-TIMING-CONTAIN]
    legacy_action_refs: [ACT-RATE-LIMIT-SOURCE]
    execution_constraints: ["slow response อย่างเดียวไม่เปิด cancel query", "cancel เฉพาะ query/session ที่ระบุ โดย DBA", "ห้าม kill ทุก slow query"]
  - action_id: ACT-DB-EGRESS-CONTAIN
    action_name: Cut DB out-of-band egress and injection path
    label_th: "ตัดช่องทางออกนอกของ DB และเส้นทาง injection"
    objective: "ตัด egress ของ DB workload ไปยัง destination/protocol ที่พบ และ connection เดิมที่เกี่ยวข้อง พร้อมจำกัด request path"
    phase: CONTAINMENT
    containment_stage: STOP_ACTIVE
    impact_level: HIGH
    review_status: IR_REVIEW_PENDING
    supported_target_types: [db_egress, web_route]
    evidence_requirements: [sq_request_query_egress_chain]
    target_requirements: [db_egress, web_route]
    runbook_refs: [RB-DB-EGRESS-CONTAIN]
    legacy_action_refs: [ACT-BLOCK-DESTINATION-IP]
    execution_constraints: ["จำกัด egress เฉพาะ destination/protocol ที่พบ", "ไม่ isolate DB ทั้งเครื่อง", "payload syntax อย่างเดียวไม่พิสูจน์ outbound"]
  - action_id: ACT-STORED-PAYLOAD-CONTAIN
    action_name: Contain second-order stored payload processing
    label_th: "จำกัดการประมวลผล payload ที่ถูกเก็บไว้ (second-order)"
    objective: "หยุด delayed processing ต่อ job/record/queued copies โดยรักษาต้นฉบับ"
    phase: CONTAINMENT
    containment_stage: STOP_ACTIVE
    impact_level: HIGH
    review_status: IR_REVIEW_PENDING
    supported_target_types: [stored_record_pipeline]
    evidence_requirements: [sq_second_order_lineage]
    target_requirements: [stored_record_pipeline]
    runbook_refs: [RB-STORED-PAYLOAD-CONTAIN]
    legacy_action_refs: []
    execution_constraints: ["ต้องมี lineage record→consumer/job→query", "ไม่ลบ records ต้นฉบับ", "pause เฉพาะ consumer/retries ที่ระบุ"]
  - action_id: ACT-BATCH-QUERY-CONTAIN
    action_name: Contain stacked/batched query path
    label_th: "จำกัดเส้นทาง stacked/batched query"
    objective: "จำกัด source path ปิด multi-statement ที่ไม่จำเป็น (เมื่อรองรับและอนุมัติ) และ contain effects ของ statements"
    phase: CONTAINMENT
    containment_stage: CLOSE_PATH
    impact_level: MEDIUM
    review_status: IR_REVIEW_PENDING
    supported_target_types: [db_driver_path, web_route]
    evidence_requirements: [sq_multi_statement_evidence]
    target_requirements: [db_driver_path]
    runbook_refs: [RB-BATCH-QUERY-CONTAIN]
    legacy_action_refs: [ACT-RATE-LIMIT-SOURCE]
    execution_constraints: ["ปิด multi-statement เมื่อรองรับและอนุมัติเท่านั้น", "semicolon อย่างเดียวไม่พิสูจน์ execution"]

playbooks:
  - playbook_id: PBK-SQ-UNION
    attack_family: SQL_INJECTION
    subtype_id: SQ-UNION
    subtype_name: Union-based
    classification_evidence:
      all_of: [{field: evidence.sq_union_requests_correlated.status, operator: equals, value: PRESENT}]
    insufficient_evidence: ["พบคำว่า UNION/SELECT หรือ semicolon ใน request เท่านั้น (SQ-P1)", "request ถูก WAF บล็อกแล้วโดยไม่มีผลต่อ response/DB"]
    scenarios:
      - scenario_id: SC-SQ-UNION-CORRELATED
        description: "Correlated malicious UNION requests ที่ route/parameter ที่ระบุ"
        ordered_action_refs:
          - {action_id: ACT-WEB-REQUEST-RESTRICT, condition: POLICY_ELIGIBLE, depends_on: [], order_reason: "ปิด injection path ที่ route/parameter ที่ยืนยัน ก่อนที่ผู้โจมตีจะดึงข้อมูลเพิ่ม", parallel_allowed: false, fallback_action: ACT-INVESTIGATE-MISSING-EVIDENCE}
    policy_refs: [POL-SQ-001, POL-SQ-008]
    related_branches:
      - {subtype_id: SQ-ERROR, open_when: {field: evidence.sq_db_error_exposed.status, operator: equals, value: PRESENT}}
      - {subtype_id: SQ-OOB, open_when: {field: evidence.sq_request_query_egress_chain.status, operator: equals, value: PRESENT}}
    stop_escalation:
      - {when: {field: scope.keyword_only_basis, operator: equals, value: true}, then: STOP, note: "keyword/semicolon ไม่พิสูจน์ execution หรือ data loss"}
    version: "2.0.0"
    provenance: *prov

  - playbook_id: PBK-SQ-ERROR
    attack_family: SQL_INJECTION
    subtype_id: SQ-ERROR
    subtype_name: Error-based
    classification_evidence:
      all_of: [{field: evidence.sq_db_error_exposed.status, operator: equals, value: PRESENT}]
    insufficient_evidence: ["DB error ใน log ภายในเท่านั้น ไม่เผยภายนอก", "error ทั่วไปที่ไม่ผูกกับ request ที่เป็นอันตราย"]
    scenarios:
      - scenario_id: SC-SQ-ERROR-EXPOSED
        description: "Request สัมพันธ์กับ DB error ที่เผยภายนอก"
        ordered_action_refs:
          - {action_id: ACT-DB-ERROR-EXPOSURE-CONTAIN, condition: POLICY_ELIGIBLE, depends_on: [], order_reason: "หยุด information leakage ที่ handler ก่อน แล้วจำกัด requests ที่ probing", parallel_allowed: false, fallback_action: ACT-INVESTIGATE-MISSING-EVIDENCE}
    policy_refs: [POL-SQ-002, POL-SQ-008]
    related_branches:
      - {subtype_id: SQ-UNION, open_when: {field: evidence.sq_union_requests_correlated.status, operator: equals, value: PRESENT}}
    stop_escalation:
      - {when: {field: scope.keyword_only_basis, operator: equals, value: true}, then: STOP, note: "keyword อย่างเดียวไม่พิสูจน์ execution"}
    version: "2.0.0"
    provenance: *prov

  - playbook_id: PBK-SQ-BOOLEAN
    attack_family: SQL_INJECTION
    subtype_id: SQ-BOOLEAN
    subtype_name: Boolean Blind
    classification_evidence:
      all_of: [{field: evidence.sq_boolean_sequence_correlated.status, operator: equals, value: PRESENT}]
    insufficient_evidence: ["request ที่มี condition true/false เพียงรายการเดียว", "ไม่มีความต่างของ response ที่สอดคล้อง"]
    scenarios:
      - scenario_id: SC-SQ-BOOLEAN-CAMPAIGN
        description: "ลำดับ request และ response behavior ที่สัมพันธ์ (อาจกระจายหลาย sources)"
        ordered_action_refs:
          - {action_id: ACT-SQLI-PROBING-RESTRICT, condition: POLICY_ELIGIBLE, depends_on: [], order_reason: "จำกัด probing ที่ endpoint/session/campaign scope ครอบคลุม distributed sources", parallel_allowed: false, fallback_action: ACT-INVESTIGATE-MISSING-EVIDENCE}
    policy_refs: [POL-SQ-003, POL-SQ-008]
    related_branches:
      - {subtype_id: SQ-TIME, open_when: {field: evidence.sq_time_query_correlation.status, operator: equals, value: PRESENT}}
    stop_escalation:
      - {when: {field: scope.single_source_only_for_campaign, operator: equals, value: true}, then: STOP, note: "campaign กระจายหลาย sources ห้าม block IP เดียวแทน"}
    version: "2.0.0"
    provenance: *prov

  - playbook_id: PBK-SQ-TIME
    attack_family: SQL_INJECTION
    subtype_id: SQ-TIME
    subtype_name: Time Blind
    classification_evidence:
      all_of: [{field: evidence.sq_time_query_correlation.status, operator: equals, value: PRESENT}]
    insufficient_evidence: ["response ช้าอย่างเดียว (SQ-P2)", "query ช้าที่ไม่ผูกกับ request ที่เป็นอันตราย"]
    scenarios:
      - scenario_id: SC-SQ-TIME-CORRELATED
        description: "Timing/query correlation ระหว่าง request กับ query/session ที่ระบุ"
        ordered_action_refs:
          - {action_id: ACT-SQLI-TIMING-CONTAIN, condition: POLICY_ELIGIBLE, depends_on: [], order_reason: "จำกัด request path เพื่อหยุด query ใหม่ แล้วขอให้ DBA cancel เฉพาะ query ที่ระบุ", parallel_allowed: false, fallback_action: ACT-INVESTIGATE-MISSING-EVIDENCE}
    policy_refs: [POL-SQ-004, POL-SQ-008]
    related_branches: []
    stop_escalation:
      - {when: {field: scope.kills_all_slow_queries, operator: equals, value: true}, then: STOP, note: "ห้าม kill ทุก slow query"}
    version: "2.0.0"
    provenance: *prov

  - playbook_id: PBK-SQ-OOB
    attack_family: SQL_INJECTION
    subtype_id: SQ-OOB
    subtype_name: Out-of-band
    classification_evidence:
      all_of: [{field: evidence.sq_request_query_egress_chain.status, operator: equals, value: PRESENT}]
    insufficient_evidence: ["payload มี syntax OOB (เช่น คำสั่งที่เรียก network) แต่ไม่พบ outbound จริง (SQ-P3)", "outbound จาก DB ที่เป็น replication/backup ที่อนุมัติ"]
    scenarios:
      - scenario_id: SC-SQ-OOB-EGRESS
        description: "request/query → DB workload → outbound activity มี correlation ครบ"
        ordered_action_refs:
          - {action_id: ACT-DB-EGRESS-CONTAIN, condition: POLICY_ELIGIBLE, depends_on: [], order_reason: "ตัด egress ที่กำลังส่งข้อมูลออกก่อน แล้วจำกัด injection path", parallel_allowed: false, fallback_action: ACT-INVESTIGATE-MISSING-EVIDENCE}
    policy_refs: [POL-SQ-005, POL-SQ-008]
    related_branches:
      - {subtype_id: EXF-DNS, open_when: {field: evidence.exf_dns_tunnel_data.status, operator: equals, value: PRESENT}}
      - {subtype_id: C2-DNS, open_when: {field: evidence.c2_dns_correlated.status, operator: equals, value: PRESENT}}
    stop_escalation:
      - {when: {field: scope.isolates_database_blanket, operator: equals, value: true}, then: STOP, note: "ห้าม isolate DB แบบเหมารวม"}
    version: "2.0.0"
    provenance: *prov

  - playbook_id: PBK-SQ-SECOND
    attack_family: SQL_INJECTION
    subtype_id: SQ-SECOND
    subtype_name: Second-order
    classification_evidence:
      all_of: [{field: evidence.sq_second_order_lineage.status, operator: equals, value: PRESENT}]
    insufficient_evidence: ["ข้อความที่ดูน่าสงสัยใน record โดยไม่มี lineage ไปยัง consumer/job และ query (SQ-P5)"]
    scenarios:
      - scenario_id: SC-SQ-SECOND-LINEAGE
        description: "record → consumer/job → harmful query มี lineage ครบ"
        ordered_action_refs:
          - {action_id: ACT-STORED-PAYLOAD-CONTAIN, condition: POLICY_ELIGIBLE, depends_on: [], order_reason: "หยุดการประมวลผลที่เลื่อนเวลาเพื่อไม่ให้ query อันตรายรันซ้ำ โดยรักษา records ต้นฉบับ", parallel_allowed: false, fallback_action: ACT-INVESTIGATE-MISSING-EVIDENCE}
    policy_refs: [POL-SQ-006, POL-SQ-008]
    related_branches: []
    stop_escalation:
      - {when: {field: scope.destroys_original_records, operator: equals, value: true}, then: STOP, note: "ต้องรักษา records ต้นฉบับ"}
    version: "2.0.0"
    provenance: *prov

  - playbook_id: PBK-SQ-STACKED
    attack_family: SQL_INJECTION
    subtype_id: SQ-STACKED
    subtype_name: Stacked/Batched
    classification_evidence:
      all_of: [{field: evidence.sq_multi_statement_evidence.status, operator: equals, value: PRESENT}]
    insufficient_evidence: ["semicolon/หลาย statement ใน payload เท่านั้นโดยไม่มี driver/query evidence (SQ-P1)"]
    scenarios:
      - scenario_id: SC-SQ-STACKED-MULTI
        description: "Driver/query evidence ว่า multiple statements ถูกรับ/ประมวลผล"
        ordered_action_refs:
          - {action_id: ACT-BATCH-QUERY-CONTAIN, condition: POLICY_ELIGIBLE, depends_on: [], order_reason: "จำกัด source path ก่อน แล้วปิด multi-statement ที่ไม่จำเป็นและ contain effects", parallel_allowed: false, fallback_action: ACT-INVESTIGATE-MISSING-EVIDENCE}
    policy_refs: [POL-SQ-007, POL-SQ-008]
    related_branches:
      - {subtype_id: PE-GRANT, open_when: {field: evidence.pe_unauthorized_entitlement_change.status, operator: equals, value: PRESENT}}
    stop_escalation:
      - {when: {field: scope.keyword_only_basis, operator: equals, value: true}, then: STOP, note: "semicolon ไม่พิสูจน์ execution"}
    version: "2.0.0"
    provenance: *prov

policies:
  - policy_id: POL-SQ-001
    rule_type: ACTION_GATE
    action_id: ACT-WEB-REQUEST-RESTRICT
    applicable_subtypes: [SQ-UNION]
    covers: [SQ-P1, SQ-P6]
    required_evidence:
      all_of: [{field: evidence.sq_union_requests_correlated.status, operator: equals, value: PRESENT}]
    required_targets:
      all_of: [{field: targets.web_route.validated, operator: equals, value: true}]
    prohibitions:
      - {id: PRH-SQ-1, reason: "SQL keyword/semicolon ไม่พิสูจน์ query execution หรือ data loss (SQ-P1)", when: {field: scope.keyword_only_basis, operator: equals, value: true}}
      - {id: PRH-SQ-2, reason: "code fix/parameterized query เป็น remediation แยกจาก containment (SQ-P6)", when: {field: scope.code_fix_in_containment, operator: equals, value: true}}
    authorization_gate: []
    authority_requirements: *change_gate
    tool_capability_requirements: [cap.waf_targeted_rule]
    criticality_constraints: []
    fallback: {action_id: ACT-INVESTIGATE-MISSING-EVIDENCE, when: "route/parameter ยังไม่ validate หรือ keyword อย่างเดียว"}
    reason: "จำกัด injection path ด้วย targeted rule ตาม approved control"
    provenance: {reference: [SQ-UNION, SQ-P1, SQ-P6]}

  - policy_id: POL-SQ-002
    rule_type: ACTION_GATE
    action_id: ACT-DB-ERROR-EXPOSURE-CONTAIN
    applicable_subtypes: [SQ-ERROR]
    covers: [SQ-P1, SQ-P6]
    required_evidence:
      all_of: [{field: evidence.sq_db_error_exposed.status, operator: equals, value: PRESENT}]
    required_targets:
      all_of: [{field: targets.response_handler.validated, operator: equals, value: true}]
    prohibitions:
      - {id: PRH-SQ-3, reason: "SQL keyword อย่างเดียวไม่พิสูจน์ execution/data loss (SQ-P1)", when: {field: scope.keyword_only_basis, operator: equals, value: true}}
      - {id: PRH-SQ-4, reason: "code fix เป็น remediation แยกจาก containment (SQ-P6)", when: {field: scope.code_fix_in_containment, operator: equals, value: true}}
    authorization_gate: []
    authority_requirements: *change_gate
    tool_capability_requirements: [cap.generic_error_response]
    criticality_constraints: []
    fallback: {action_id: ACT-INVESTIGATE-MISSING-EVIDENCE, when: "ยังไม่ยืนยัน error ที่เผยภายนอกหรือ handler"}
    reason: "ลด leakage ด้วย generic external response โดยคง internal logging"
    provenance: {reference: [SQ-ERROR, SQ-P1, SQ-P6]}

  - policy_id: POL-SQ-003
    rule_type: ACTION_GATE
    action_id: ACT-SQLI-PROBING-RESTRICT
    applicable_subtypes: [SQ-BOOLEAN]
    covers: [SQ-P1]
    required_evidence:
      all_of: [{field: evidence.sq_boolean_sequence_correlated.status, operator: equals, value: PRESENT}]
