    required_targets: [cloud_trust]
    required_capabilities: [cap.entitlement_management, cap.session_revocation, cap.secret_rotation, cap.config_snapshot]
    tool_variants: *neutral
    required_authority: [ir_execute]
    operational_impact: "services ที่ใช้ trust/role เดียวกันอาจกระทบ — ตรวจ dependencies ก่อน"
    ordered_steps:
      - step_id: S1
        origin: EXPANDED_FROM_REFERENCE
        fold: true
        instruction: "ยืนยัน trust/policy {{cloud_trust.trust_or_policy_ref}} ของ principal {{cloud_trust.principal_id}} ({{cloud_trust.provider}}) ถูกใช้โดยไม่ได้รับอนุญาตตาม audit และไม่ใช่ automation role ที่อนุมัติ"
        expected_result: "รายการที่ต้อง restrict ถูกต้อง"
        verify: "เทียบ cloud audit และรายการ approved roles"
        on_failure: "ไม่ restrict; คงสถานะ NEEDS_EVIDENCE"
      - step_id: S2
        origin: EXPANDED_FROM_REFERENCE
        fold: true
        instruction: "บันทึก trust/policy ปัจจุบันก่อนแก้"
        condition: {all_of: [{field: capability.cap.config_snapshot.supported, operator: equals, value: true}]}
        expected_result: "มี snapshot"
        verify: "snapshot ใน incident record"
        on_failure: "บันทึกด้วยมือ"
      - step_id: S3
        title: "Restrict trust {{cloud_trust.trust_or_policy_ref}} ต่อ resources {{cloud_trust.resources}}"
        origin: EXPANDED_FROM_REFERENCE
        instruction: "Restrict trust/grant {{cloud_trust.trust_or_policy_ref}} ต่อ resources {{cloud_trust.resources}} เฉพาะส่วนที่มี evidence (ไม่ปรับ policy ทั้ง account)"
        method: "จำกัด trust/grant {{cloud_trust.trust_or_policy_ref}} เฉพาะส่วนที่มีหลักฐานต่อ {{cloud_trust.resources}} (ไม่ปรับ policy ทั้ง account) บันทึก policy เดิมก่อนแก้ แล้วตรวจจาก cloud audit ว่า assume/use ใหม่ถูกปฏิเสธ"
        method_basis: NEUTRAL_DERIVED
        condition: {all_of: [{field: capability.cap.entitlement_management.supported, operator: equals, value: true}]}
        expected_result: "principal เข้า resources ผ่าน trust นี้ไม่ได้"
        verify: "assume/use ใหม่ถูกปฏิเสธตาม cloud audit"
        on_failure: "escalate IR/เจ้าของ cloud account"
        rollback: "คืน policy จาก snapshot ตาม IR approval"
        impact: "services ที่ใช้ trust/role นี้อาจเข้า resources ไม่ได้"
      - step_id: S4
        origin: EXPANDED_FROM_REFERENCE
        instruction: "Revoke sessions ที่ออกจากการ assume role นี้ของ {{session.account_id}} ที่ {{session.provider}} (policy change อาจไม่ invalidate session ที่ออกแล้ว)"
        include_runbook: RB-SESSION-REVOKE
        condition: {all_of: [{field: targets.session.validated, operator: equals, value: true}]}
        expected_result: "sessions เดิมใช้ไม่ได้"
        verify: "request ด้วย session เดิมถูกปฏิเสธ"
        on_failure: "ใช้ access restriction ตามขั้นตอน revoke session"
      - step_id: S5
        origin: EXPANDED_FROM_REFERENCE
        instruction: "จัดการ credential ที่ถูกเปิดเผย {{secret_credential.credential_id}} ตามแผน dependents"
        include_runbook: RB-SERVICE-SECRET-CONTAIN
        condition: {all_of: [{field: targets.secret_credential.validated, operator: equals, value: true}]}
        expected_result: "credential ใหม่ใช้ได้และเดิมถูก revoke"
        verify: "การใช้ credential เดิมถูกปฏิเสธ"
        on_failure: "ตามขั้นตอน rotate secret"
      - step_id: S6
        kind: verify
        origin: EXPANDED_FROM_REFERENCE
        instruction: "ตรวจ cloud audit ว่าไม่มีการ assume/use ใหม่ของ trust นี้โดยไม่ได้รับอนุญาต และ approved administration/recovery access ยังใช้ได้"
        expected_result: "ไม่มีการใช้ซ้ำ"
        verify: "re-hunt role assumption ในช่วงเฝ้าระวัง"
        on_failure: "restrict เฉพาะ trust เพิ่มที่มี evidence"
    verification: ["ไม่มีการ assume/use ใหม่ที่ไม่ได้รับอนุญาต", "approved admin/recovery access ใช้ได้"]
    failure_handling: ["พบ trust อื่น → restrict เฉพาะที่มี evidence"]
    rollback: ["คืน trust/policy จาก snapshot ตาม IR approval"]
