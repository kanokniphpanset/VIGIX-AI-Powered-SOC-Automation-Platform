    tool_variants: *neutral
    required_authority: [ir_execute]
    operational_impact: "แอปที่ถือ grant นี้เข้าถึง resource ไม่ได้; ผู้ใช้อาจต้อง consent ใหม่หากเป็นแอปที่ถูกต้อง"
    ordered_steps:
      - step_id: S1
        origin: EXPANDED_FROM_REFERENCE
        fold: true
        instruction: "ตรวจ client {{oauth_grant.client_id}} / principal {{oauth_grant.principal_id}} / grant {{oauth_grant.grant_id}} ที่ {{oauth_grant.provider}} ({{oauth_grant.tenant_or_scope}}) ว่าไม่ใช่แอปที่ได้รับอนุมัติ"
        expected_result: "ยืนยัน grant ที่ไม่ได้รับอนุมัติ"
        verify: "เทียบกับรายการ approved applications และ consent audit"
        on_failure: "ไม่ revoke จนกว่าจะแยกจากแอปที่ถูกต้อง"
      - step_id: S2
        title: "ถอน grant {{oauth_grant.grant_id}} ของ client {{oauth_grant.client_id}} (principal {{oauth_grant.principal_id}})"
        origin: EXPANDED_FROM_REFERENCE
        instruction: "ถอน grant {{oauth_grant.grant_id}} ของ client {{oauth_grant.client_id}} สำหรับ principal {{oauth_grant.principal_id}} ที่ {{oauth_grant.provider}}"
        method: "ในส่วนจัดการของ {{oauth_grant.provider}} หา grant {{oauth_grant.grant_id}} ของ client {{oauth_grant.client_id}} สำหรับ principal {{oauth_grant.principal_id}} แล้วถอนเฉพาะ grant นั้น (ไม่ถอน grant อื่นของ client หรือ principal) บันทึก grant ก่อนถอน แล้วตรวจว่าไม่อยู่ในรายการ consent ของ principal"
        method_basis: NEUTRAL_DERIVED
        condition: {all_of: [{field: capability.cap.oauth_grant_revocation.supported, operator: equals, value: true}]}
        expected_result: "grant ไม่ active"
        verify: "grant ไม่ปรากฏในรายการ consent ของ principal"
        on_failure: "ใช้ขั้นตอน restrict resource access (S4)"
        rollback: "ให้ consent ใหม่ผ่านกระบวนการอนุมัติหากพบว่าเป็นแอปที่ถูกต้อง"
      - step_id: S3
        title: "Revoke access/refresh tokens ของ grant {{oauth_grant.grant_id}} (token family {{oauth_grant.token_family_id}})"
        origin: EXPANDED_FROM_REFERENCE
        instruction: "Revoke access/refresh tokens ที่ออกภายใต้ grant {{oauth_grant.grant_id}} (token family {{oauth_grant.token_family_id}}) ตามความสามารถของ {{oauth_grant.provider}} — การ revoke grant อาจไม่ invalidate token ที่ออกแล้วทันที"
        method_basis: ORG_INPUT_REQUIRED
        method_requires: "ความสามารถของ provider ในการ revoke access/refresh token ที่ออกแล้วและวิธี invalidate token family"
        condition: {all_of: [{field: capability.cap.oauth_grant_revocation.supported, operator: equals, value: true}]}
        expected_result: "token ใช้เรียก API ไม่ได้"
        verify: "API call ด้วย token family นั้นถูกปฏิเสธตาม log"
        on_failure: "restrict resource access ใน S4"
      - step_id: S4
        title: "จำกัดการเข้าถึง {{oauth_grant.resources}} ของ principal {{oauth_grant.principal_id}} สำหรับ client {{oauth_grant.client_id}}"
        origin: EXPANDED_FROM_REFERENCE
        instruction: "จำกัดการเข้าถึง {{oauth_grant.resources}} ของ principal {{oauth_grant.principal_id}} สำหรับ client {{oauth_grant.client_id}} ด้วย access restriction ที่ {{oauth_grant.provider}} รองรับ จนกว่า token จะหมดอายุ"
        method_basis: ORG_INPUT_REQUIRED
        method_requires: "access restriction ที่ provider รองรับสำหรับ resource/principal/client นี้ จนกว่า token จะหมดอายุ"
        condition: {all_of: [{field: capability.cap.oauth_grant_revocation.supported, operator: equals, value: false}]}
        expected_result: "API access ต่อ resources ถูกตัด"
        verify: "API call ถูกปฏิเสธตาม log"
        on_failure: "escalate IR"
      - step_id: S5
        kind: verify
        origin: EXPANDED_FROM_REFERENCE
        instruction: "ตรวจ audit log ว่าไม่มี API call ใหม่จาก client {{oauth_grant.client_id}} และไม่ใช้ password reset แทนการ revoke grant"
        expected_result: "ไม่มี API call ใหม่"
        verify: "re-hunt client_id/grant_id ใน audit log"
        on_failure: "ตรวจ grant อื่นของ client เดียวกันและ principal อื่น"
    verification: ["ไม่มี API call ใหม่จาก grant/token ที่ถอน"]
    failure_handling: ["พบ grant อื่นของ client → ประเมินแยกเป็น grant ต่อ grant ไม่ revoke ทั้งแอปโดยไม่มีหลักฐาน"]
    rollback: ["ให้ consent ใหม่ผ่านการอนุมัติ"]

  - runbook_id: RB-BEC-CONTAIN
    review_status: IR_REVIEW_PENDING
    supported_action_ids: [ACT-BEC-CONTAIN]
    supported_subtypes: [PH-BEC]
    objective: "ผู้มีอำนาจ hold business item; IR revoke mailbox access ที่ไม่ได้รับอนุญาตและ disable rules ที่เกี่ยวข้อง"
    prerequisites: ["ผู้มีอำนาจของ business item ที่ระบุตัวได้", "ช่องทางยืนยันนอก email ที่ผู้มีอำนาจใช้"]
    required_evidence: [ph_bec_fraudulent_instruction]
    required_targets: [business_item]
    required_capabilities: [cap.session_revocation, cap.mail_rule_management]
    tool_variants: *neutral
    required_authority: [ir_execute, business_authority]
    operational_impact: "ธุรกรรมที่ถูก hold จะล่าช้าจนกว่าผู้มีอำนาจยืนยัน"
    ordered_steps:
      - step_id: S1
        title: "ให้ {{business_item.owning_authority}} hold รายการ {{business_item.item_reference}}"
        origin: EXPANDED_FROM_REFERENCE
        manual_owner: business_authority
        instruction: "ขอให้ {{business_item.owning_authority}} (ผู้มีอำนาจ) hold รายการ {{business_item.item_reference}} และยืนยันกับคู่ค้าผ่านช่องทางที่ทราบอยู่แล้ว ไม่ใช้ข้อมูลติดต่อจากอีเมลคำสั่ง — IR ไม่ hold ธุรกรรมแทน"
        method_basis: ORG_INPUT_REQUIRED
        method_requires: "ผู้มีอำนาจของรายการธุรกิจและช่องทางติดต่อคู่ค้าที่องค์กรยืนยันแล้ว"
        expected_result: "ธุรกรรมถูก hold โดยผู้มีอำนาจ"
        verify: "ผู้มีอำนาจแจ้งกลับว่า hold แล้ว (บันทึกใน incident record)"
        on_failure: "escalate หัวหน้าของผู้มีอำนาจตามสายอนุมัติขององค์กร"
        impact: "ธุรกรรมล่าช้าจนกว่าจะยืนยันได้"
      - step_id: S2
        origin: EXPANDED_FROM_REFERENCE
        instruction: "Revoke sessions ที่ไม่ได้รับอนุญาตของ mailbox {{mailbox_access.mailbox_id}} ({{mailbox_access.tenant_id}})"
        include_runbook: RB-SESSION-REVOKE
        condition: {all_of: [{field: targets.mailbox_access.validated, operator: equals, value: true}, {field: targets.session.validated, operator: equals, value: true}, {field: evidence.ph_bec_mailbox_abuse.status, operator: equals, value: PRESENT}]}
        expected_result: "sessions ที่ไม่ได้รับอนุญาตถูกยกเลิก"
        verify: "ไม่มี session ที่ไม่รู้จักใน mailbox"
        on_failure: "ใช้ access restriction ตามขั้นตอน revoke session"
      - step_id: S3
        title: "Disable {{mailbox_access.abused_objects}} ใน mailbox {{mailbox_access.mailbox_id}}"
        origin: EXPANDED_FROM_REFERENCE
        instruction: "Disable forwarding rule/delegate ที่ไม่ได้รับอนุญาตใน {{mailbox_access.mailbox_id}}: {{mailbox_access.abused_objects}} (เฉพาะรายการที่ยืนยัน)"
        method: "ใน mailbox {{mailbox_access.mailbox_id}} ปิด (disable) เฉพาะ {{mailbox_access.abused_objects}} ที่ยืนยันแล้วว่าไม่ได้รับอนุญาต (forwarding rule/delegate) บันทึกรายการก่อนแก้ แล้วตรวจรายการอีกครั้งว่าไม่มีรายการดังกล่าว"
        method_basis: NEUTRAL_DERIVED
        condition: {all_of: [{field: targets.mailbox_access.validated, operator: equals, value: true}, {field: evidence.ph_bec_mailbox_abuse.status, operator: equals, value: PRESENT}, {field: capability.cap.mail_rule_management.supported, operator: equals, value: true}]}
        expected_result: "rule/delegate ที่ระบุไม่ทำงาน"
        verify: "รายการ rule/delegate ของ mailbox ไม่มีรายการดังกล่าว"
        on_failure: "ปิด forwarding ภายนอกชั่วคราวระดับ mailbox ตามที่รองรับและ escalate IR"
        rollback: "คืน rule ที่ถูกต้องซึ่งเจ้าของยืนยัน"
      - step_id: S4
        kind: verify
        origin: EXPANDED_FROM_REFERENCE
        instruction: "ตรวจ mailbox audit ของ {{mailbox_access.mailbox_id}} หลังดำเนินการ: ไม่มี rule/delegate/sign-in ใหม่ที่ไม่ได้รับอนุญาต"
        condition: {all_of: [{field: targets.mailbox_access.validated, operator: equals, value: true}]}
        expected_result: "ไม่พบ abuse ใหม่"
        verify: "re-hunt mailbox audit ช่วงเฝ้าระวัง"
        on_failure: "เปิด branch Account Compromise ตามหลักฐานใหม่"
    verification: ["ผู้มีอำนาจยืนยัน hold", "mailbox ไม่มี session/rule/delegate ที่ไม่ได้รับอนุญาต"]
    failure_handling: ["พบ abuse ต่อ → Account Compromise branch; ธุรกรรมอื่นที่เกี่ยวข้องส่งให้ผู้มีอำนาจตรวจ"]
    rollback: ["คืน rule ที่ถูกต้อง; hold ถูกปล่อยโดยผู้มีอำนาจเท่านั้น"]
