runbooks:
  - runbook_id: RB-MAIL-CAMPAIGN-QUARANTINE
    review_status: IR_REVIEW_PENDING
    supported_action_ids: [ACT-MAIL-CAMPAIGN-QUARANTINE]
    supported_subtypes: [PH-ATTACH]
    objective: "Quarantine messages ของ campaign และจำกัด attachment ที่ระบุ"
    prerequisites: ["campaign match (sender/subject/attachment id) ที่ยืนยันแล้ว", "รู้ว่า mail platform ดึงข้อความที่ส่งถึง inbox แล้วกลับได้หรือไม่"]
    required_evidence: [ph_malicious_attachment_delivered]
    required_targets: [message_set]
    required_capabilities: [cap.mail_quarantine]
    tool_variants: *neutral
    required_authority: [ir_execute]
    operational_impact: "ข้อความของ campaign หายจาก mailbox ผู้รับ; ข้อความถูกต้องที่ match เกณฑ์อาจถูกดึงด้วย — ตรวจเกณฑ์ก่อน"
    ordered_steps:
      - step_id: S1
        origin: EXPANDED_FROM_REFERENCE
        fold: true
        instruction: "ยืนยันเกณฑ์ match ของ campaign {{message_set.message_ids_or_campaign_id}} บน {{message_set.provider}} (tenant {{message_set.tenant_id}}) ให้ครอบคลุมเฉพาะข้อความของ campaign ใน {{message_set.mailbox_scope}}"
        expected_result: "set ของข้อความถูกจำกัดที่ campaign"
        verify: "ตัวอย่างข้อความที่ match เป็นของ campaign ทั้งหมด"
        on_failure: "แคบเกณฑ์ลง ห้ามขยายเกินหลักฐาน"
      - step_id: S2
        title: "Quarantine ข้อความของ campaign {{message_set.message_ids_or_campaign_id}} ใน {{message_set.mailbox_scope}}"
        origin: EXPANDED_FROM_REFERENCE
        instruction: "Quarantine ข้อความของ campaign {{message_set.message_ids_or_campaign_id}} ออกจาก mailboxes ใน {{message_set.mailbox_scope}} (รวมข้อความที่ส่งถึง inbox แล้ว)"
        method: "ใน mail system ค้นหาข้อความด้วยเกณฑ์ของ {{message_set.message_ids_or_campaign_id}} ในขอบเขต {{message_set.mailbox_scope}} (รวมข้อความที่ถึง inbox แล้ว) แล้วย้ายเข้า quarantine โดยไม่ลบ เก็บรายการข้อความที่ย้ายไว้ใน incident record และค้นหาซ้ำด้วยเกณฑ์เดิมเพื่อตรวจว่าไม่เหลือข้อความ active"
        method_basis: NEUTRAL_DERIVED
        expected_result: "ข้อความไม่อยู่ใน inbox ผู้รับ"
        verify: "ค้นหาซ้ำด้วยเกณฑ์เดิมไม่พบข้อความ active ใน mailbox"
        on_failure: "ถ้า purge หลังส่งไม่ได้ ให้แจ้งผู้รับที่ระบุผ่านช่องทางที่อนุมัติและ escalate IR"
        rollback: "release จาก quarantine เฉพาะข้อความที่ IR ยืนยันว่า false positive"
        impact: "ข้อความที่ match จะถูกดึงจากผู้รับทั้งหมดใน scope"
      - step_id: S3
        title: "จำกัด attachment {{message_set.attachment_ref}} ที่ mail gateway/endpoint control"
        origin: EXPANDED_FROM_REFERENCE
        instruction: "จำกัด attachment {{message_set.attachment_ref}} ที่ mail gateway/endpoint control (block ตาม attachment identity) หากเครื่องมือรองรับ"
        method_basis: ORG_INPUT_REQUIRED
        method_requires: "ความสามารถของ mail gateway/endpoint control ในการ block ตามตัวตนของ attachment (เช่น hash ชื่อ หรือชนิด) และข้อมูลที่ใช้ระบุ attachment"
        condition: {all_of: [{field: capability.cap.mail_web_link_control.supported, operator: equals, value: true}]}
        expected_result: "attachment ที่ระบุถูกบล็อกไม่ให้ส่ง/เปิดซ้ำ"
        verify: "ข้อความใหม่ที่มี attachment เดียวกันถูกบล็อก"
        on_failure: "ใช้ quarantine ตามรอบแทน"
      - step_id: S4
        title: "ระบุผู้รับที่เปิด/ดาวน์โหลด/รัน attachment เพื่อประเมินเป็นรายเครื่อง"
        origin: EXPANDED_FROM_REFERENCE
        instruction: "ระบุผู้รับที่เปิด/ดาวน์โหลด/รัน attachment จาก telemetry แล้วประเมินแยกเป็นรายเครื่อง (ไม่ isolate ผู้รับทุกคน)"
        method: "ใช้ telemetry ที่มี (เช่น mail log และ endpoint log) ของ campaign {{message_set.message_ids_or_campaign_id}} หาผู้รับที่เปิด ดาวน์โหลด หรือรัน attachment แล้วประเมินแยกเป็นรายเครื่อง โดยอ้างอิงหลักฐานต่อรายการ ไม่ isolate ผู้รับทุกคน ผลคือรายชื่อพร้อม source ref เพื่อส่งต่อขั้นตอนของเครื่องหรือบัญชีที่ validated"
        method_basis: NEUTRAL_DERIVED
        expected_result: "รู้รายชื่อผู้รับที่มี open/execute evidence"
        verify: "รายชื่อมี source ref ต่อรายการ"
        on_failure: "คงสถานะ UNKNOWN และไม่อนุมานว่ารัน"
    verification: ["ไม่พบข้อความ/attachment ของ campaign ใน mailbox scope", "รายชื่อผู้รับที่เปิดไฟล์ผูกกับหลักฐาน"]
    failure_handling: ["ข้อความใหม่ในรูปแบบเดียวกัน → ปรับเกณฑ์ตามหลักฐานใหม่"]
    rollback: ["release จาก quarantine ตาม IR approval"]

  - runbook_id: RB-PHISHING-LINK-RESTRICT
    review_status: IR_REVIEW_PENDING
    supported_action_ids: [ACT-PHISHING-LINK-RESTRICT]
    supported_subtypes: [PH-LINK]
    objective: "จำกัดลิงก์ที่ mail/web control และ quarantine messages ตาม campaign scope"
    prerequisites: ["chain ที่ยืนยัน (message→URL→page)", "รู้ granularity ที่ control รองรับ (path/domain/IP)"]
    required_evidence: [ph_malicious_link_chain]
    required_targets: [url_object]
    required_capabilities: [cap.mail_web_link_control, cap.mail_quarantine, cap.config_snapshot]
    tool_variants: *neutral
    required_authority: [ir_execute]
    operational_impact: "ผู้ใช้เข้าลิงก์/โดเมนที่ระบุไม่ได้; ถ้าเป็น shared hosting จะกระทบเว็บอื่นเมื่อ block กว้าง"
    ordered_steps:
      - step_id: S1
        origin: EXPANDED_FROM_REFERENCE
        fold: true
        instruction: "ยืนยันว่า {{url_object.url_or_domain}} (granularity: {{url_object.granularity}}) อยู่ใน chain อันตรายและไม่ใช่ shared infrastructure ที่ต้อง block แบบ granular"
        expected_result: "รู้ระดับที่ควร block"
        verify: "เทียบกับ evidence chain และ provider ของโฮสต์"
        on_failure: "ใช้ granularity ละเอียดที่สุดที่รองรับ หรือ escalate IR"
      - step_id: S2
        title: "Block {{url_object.url_or_domain}} ที่ระดับ {{url_object.granularity}}"
        origin: EXPANDED_FROM_REFERENCE
        instruction: "Block {{url_object.url_or_domain}} ที่ mail/web control ตามระดับ {{url_object.granularity}} (ไม่ block ทั้ง provider/CDN เมื่อทำเป็นรายเส้นทางได้)"
        method: "ตั้ง block ที่ mail/web control ตามระดับ {{url_object.granularity}} ของ {{url_object.url_or_domain}} (ถ้าเป็น shared cloud/CDN ห้าม block ทั้ง provider; ระดับ path ต้องใช้เครื่องมือที่เห็น path และ DNS ตัดได้เพียงระดับ domain) บันทึก rule เดิมก่อนแก้ แล้วทดสอบด้วย URL ว่าถูกบล็อกตาม log"
        method_basis: NEUTRAL_DERIVED
        expected_result: "ผู้ใช้เข้า URL ที่ระบุไม่ได้"
        verify: "ทดสอบ URL ถูกบล็อกตาม log ของ control"
        on_failure: "ถ้า control ไม่รองรับ granular ให้ใช้ระดับ domain ที่ IR อนุมัติ"
        rollback: "ถอน rule ตาม snapshot"
        impact: "เว็บอื่นบน domain เดียวกันอาจเข้าไม่ได้เมื่อ block ระดับ domain"
      - step_id: S3
        title: "Quarantine ข้อความที่มี link นี้ใน {{message_set.mailbox_scope}}"
        origin: EXPANDED_FROM_REFERENCE
        instruction: "Quarantine messages ที่มี link นี้ใน {{message_set.mailbox_scope}} ({{message_set.message_ids_or_campaign_id}})"
        method: "ใน mail system ค้นหาข้อความที่มี link นี้ในขอบเขต {{message_set.mailbox_scope}} ({{message_set.message_ids_or_campaign_id}}) แล้วย้ายเข้า quarantine โดยไม่ลบ เก็บรายการข้อความที่ย้ายไว้ใน incident record และค้นหาซ้ำเพื่อตรวจว่าไม่เหลือข้อความ active"
        method_basis: NEUTRAL_DERIVED
        condition: {all_of: [{field: targets.message_set.validated, operator: equals, value: true}, {field: capability.cap.mail_quarantine.supported, operator: equals, value: true}]}
        expected_result: "ข้อความ campaign ไม่อยู่ใน inbox"
        verify: "ค้นหาซ้ำไม่พบ"
        on_failure: "escalate IR"
      - step_id: S4
        kind: verify
        origin: EXPANDED_FROM_REFERENCE
        instruction: "ตรวจ web/proxy log หา request ใหม่ไปยัง {{url_object.url_or_domain}} และรายชื่อผู้ที่คลิก (click ≠ submission — ถ้ามี submission ให้ประเมิน Credential Harvesting)"
        expected_result: "ไม่มี request ใหม่ผ่าน control"
        verify: "re-hunt URL ใน proxy log"
        on_failure: "ตรวจ redirect/mirror domain ใหม่ของ campaign"
    verification: ["ไม่มี request ใหม่ไปยัง URL ที่ block", "ข้อความ campaign ถูก quarantine ใน scope"]
    failure_handling: ["ผู้โจมตีเปลี่ยน domain → เพิ่ม URL ตามหลักฐาน ไม่ block กว้างล่วงหน้า"]
    rollback: ["ถอน block rule ตาม snapshot"]

  - runbook_id: RB-HARVESTING-CONTAIN
    review_status: IR_REVIEW_PENDING
    supported_action_ids: [ACT-HARVESTING-CONTAIN]
    supported_subtypes: [PH-CREDS]
    objective: "จำกัด page/messages แล้ว revoke sessions และจัดการ credentials ของ identities ที่ submit"
    prerequisites: ["page URL ที่ยืนยัน", "รายชื่อ identities ที่ submit/ถูกใช้พร้อมหลักฐาน"]
    required_evidence: [ph_credential_submission]
    required_targets: [url_object]
    required_capabilities: [cap.mail_web_link_control, cap.session_revocation, cap.identity_restriction]
    tool_variants: *neutral
    required_authority: [ir_execute]
    operational_impact: "ผู้ใช้ที่ submit ต้องเปลี่ยน credential และ sign-in ใหม่"
    ordered_steps:
      - step_id: S1
        title: "Block หน้า {{url_object.url_or_domain}} ที่ระดับ {{url_object.granularity}}"
        origin: EXPANDED_FROM_REFERENCE
        instruction: "Block page {{url_object.url_or_domain}} ที่ mail/web control ตามระดับ {{url_object.granularity}} เพื่อหยุดการเก็บ credential เพิ่ม"
        method: "ตั้ง block ที่ mail/web control ตามระดับ {{url_object.granularity}} ของ {{url_object.url_or_domain}} (ถ้าเป็น shared cloud/CDN ห้าม block ทั้ง provider; ระดับ path ต้องใช้เครื่องมือที่เห็น path และ DNS ตัดได้เพียงระดับ domain) บันทึก rule เดิมก่อนแก้ แล้วทดสอบด้วย URL ว่าถูกบล็อกตาม log"
        method_basis: NEUTRAL_DERIVED
        expected_result: "ผู้ใช้เข้า page ไม่ได้"
        verify: "ทดสอบ URL ถูกบล็อกตาม log"
        on_failure: "ใช้ระดับ domain ที่รองรับและ escalate IR"
        rollback: "ถอน rule ตาม snapshot"
      - step_id: S2
        title: "Quarantine ข้อความที่นำไปสู่หน้าดังกล่าวใน {{message_set.mailbox_scope}}"
        origin: EXPANDED_FROM_REFERENCE
        instruction: "Quarantine messages ที่นำไปสู่ page ใน {{message_set.mailbox_scope}} ({{message_set.message_ids_or_campaign_id}})"
        method: "ใน mail system ค้นหาข้อความที่นำไปสู่หน้านี้ในขอบเขต {{message_set.mailbox_scope}} ({{message_set.message_ids_or_campaign_id}}) แล้วย้ายเข้า quarantine โดยไม่ลบ เก็บรายการที่ย้ายไว้ใน incident record และค้นหาซ้ำเพื่อตรวจว่าไม่เหลือข้อความ active"
        method_basis: NEUTRAL_DERIVED
        condition: {all_of: [{field: targets.message_set.validated, operator: equals, value: true}, {field: capability.cap.mail_quarantine.supported, operator: equals, value: true}]}
        expected_result: "ข้อความไม่อยู่ใน inbox"
        verify: "ค้นหาซ้ำไม่พบ"
        on_failure: "escalate IR"
      - step_id: S3
        title: "Revoke sessions ของบัญชี {{account_identity.account_id}} ที่ {{account_identity.provider}}"
        origin: EXPANDED_FROM_REFERENCE
        instruction: "Revoke sessions ของ {{account_identity.account_id}} ที่ {{account_identity.provider}} ก่อนเปลี่ยน credential (reset อย่างเดียวไม่ทำให้ session เดิมหมด)"
        method: "ใช้เครื่องมือจัดการ identity ของ {{account_identity.provider}} แสดงรายการ session และ refresh token ของ {{account_identity.account_id}} แล้ว revoke ทุกรายการ บันทึกรายการก่อน revoke เพื่อใช้เทียบ และทำก่อนการเปลี่ยน credential เสมอ (session ใหม่ของเจ้าของที่ยืนยันตัวตนแล้วหลังขั้นตอนนี้ไม่ต้อง revoke)"
        method_basis: NEUTRAL_DERIVED
        condition: {all_of: [{field: targets.account_identity.validated, operator: equals, value: true}, {field: capability.cap.session_revocation.supported, operator: equals, value: true}]}
        expected_result: "ไม่มี session active ของ identity ที่ submit"
        verify: "รายการ session ว่างหรือมีเฉพาะ session ใหม่ของเจ้าของ"
        on_failure: "ใช้ access restriction ตามขั้นตอน revoke session"
      - step_id: S4
        title: "บังคับเปลี่ยน credential ของบัญชี {{account_identity.account_id}} ที่ submit"
        origin: EXPANDED_FROM_REFERENCE
        instruction: "บังคับเปลี่ยน credential ของ {{account_identity.account_id}} ผ่านช่องทางยืนยันตัวตนเจ้าของ (เฉพาะ identity ที่ submit ตาม evidence)"
        method_basis: ORG_INPUT_REQUIRED
        method_requires: "ขั้นตอนยืนยันตัวตนเจ้าของบัญชีและช่องทางส่ง credential ใหม่ที่องค์กรอนุมัติ"
        condition: {all_of: [{field: targets.account_identity.validated, operator: equals, value: true}]}
        expected_result: "credential ใหม่ถูกตั้งโดยเจ้าของ"
        verify: "authentication ด้วย credential เดิมถูกปฏิเสธ"
        on_failure: "restrict บัญชีชั่วคราวและ escalate IR"
        impact: "เจ้าของบัญชีต้อง sign-in ใหม่"
      - step_id: S5
        kind: verify
        origin: EXPANDED_FROM_REFERENCE
        instruction: "ตรวจ sign-in ของ identity ที่ submit หลังเหตุการณ์: ถ้าพบ authentication สำเร็จที่ไม่ได้รับอนุญาต ให้เปิดขั้นตอน Account Compromise สำหรับบัญชีนั้น"
        condition: {all_of: [{field: targets.account_identity.validated, operator: equals, value: true}]}
        expected_result: "รู้ว่ามี/ไม่มี unauthorized success"
        verify: "re-hunt sign-in ช่วงหลังเวลา submission"
        on_failure: "ถือว่า UNKNOWN และไม่สรุปว่าไม่ถูกใช้"
    verification: ["page ถูกบล็อก", "identity ที่ submit ไม่มี session/credential เดิมเหลือ"]
    failure_handling: ["พบ login ผิดปกติ → AC-PASSWORD/AC-SESSION branch"]
    rollback: ["ถอน block ตาม snapshot; คืนบัญชีตามที่ IR อนุมัติ"]

  - runbook_id: RB-OAUTH-GRANT-CONTAIN
    review_status: IR_REVIEW_PENDING
    supported_action_ids: [ACT-OAUTH-GRANT-CONTAIN]
    supported_subtypes: [PH-CONSENT, AC-OAUTH]
    objective: "ถอน grant ที่ไม่ได้รับอนุมัติ จำกัด principal/resource access และจัดการ tokens ตาม platform capability"
    prerequisites: ["client_id, principal_id, grant_id, scopes, resources", "รู้ provider runbook สำหรับ revoke grant/token"]
    required_evidence: [ph_unauthorized_oauth_consent, ac_oauth_unauthorized_api_calls]
