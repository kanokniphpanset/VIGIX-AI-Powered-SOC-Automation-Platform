# PHISHING — family file. Reference: reference-registry.yaml#PHISHING
# Owns the SHARED action ACT-OAUTH-GRANT-CONTAIN / RB-OAUTH-GRANT-CONTAIN (also used by AC-OAUTH).
# Scenario discipline (PH-P1): delivery, click, submission and execution are separate scenarios with separate evidence.

family: PHISHING
defaults:
  neutral_tool_variants: &neutral
    - {variant_id: platform_neutral, tool: TOOL_MAPPING_REQUIRED, note: "Organization tool mapping MISSING; steps are role-level."}
  prov: &prov {reference: PHISHING, registry_version: ref-2026-10-08, playbook_version: "2.0.0"}
  exec_branch_open: &exec_branch_open
    - {subtype_id: MAL-RANSOM,   open_when: {all_of: [{field: evidence.ph_attachment_executed.status, operator: equals, value: PRESENT}, {field: evidence.mal_active_damage.status, operator: equals, value: PRESENT}]}, gate_policy: POL-PH-006}
    - {subtype_id: MAL-BACKDOOR, open_when: {all_of: [{field: evidence.ph_attachment_executed.status, operator: equals, value: PRESENT}, {field: evidence.mal_remote_access_or_persistence.status, operator: equals, value: PRESENT}]}, gate_policy: POL-PH-006}
    - {subtype_id: MAL-STEALER,  open_when: {all_of: [{field: evidence.ph_attachment_executed.status, operator: equals, value: PRESENT}, {field: evidence.mal_collection_or_transfer.status, operator: equals, value: PRESENT}]}, gate_policy: POL-PH-006}
    - {subtype_id: MAL-MEMORY,   open_when: {all_of: [{field: evidence.ph_attachment_executed.status, operator: equals, value: PRESENT}, {field: evidence.mal_memory_execution.status, operator: equals, value: PRESENT}]}, gate_policy: POL-PH-006}
    - {subtype_id: PROC-CHAIN,   open_when: {all_of: [{field: evidence.ph_attachment_executed.status, operator: equals, value: PRESENT}, {field: evidence.proc_app_to_interpreter_chain.status, operator: equals, value: PRESENT}]}, gate_policy: POL-PH-006}

evidence:
  - id: ph_malicious_attachment_delivered
    description: "Malicious attachment confirmed and bound to message(s)/recipients (DELIVERY state only)."
    confirm: "ยืนยันว่า attachment เป็นอันตราย (verdict/sandbox/analyst) และผูกกับ message id + ผู้รับ"
    may_be_authorized: false
  - id: ph_attachment_executed
    description: "Execution of the attachment (or its dropped payload) on an endpoint — separate from delivery."
    confirm: "หา process/endpoint event ที่เปิด/รัน attachment บน host ของผู้รับ (ไม่อนุมานจากการส่งถึง)"
    may_be_authorized: false
  - id: ph_malicious_link_chain
    description: "Message -> link chain confirmed malicious (DELIVERY of the link)."
    confirm: "ยืนยัน chain message→URL→redirect→page ว่าเป็นอันตราย (verdict/analyst)"
    may_be_authorized: false
  - id: ph_link_clicked
    description: "User click on the malicious link (CLICK state; not submission)."
    confirm: "หา proxy/web log ที่ผู้รับเข้า URL ใน chain"
    may_be_authorized: false
  - id: ph_credential_submission
    description: "Credential submission to the harvesting page, or identity abuse correlated to the page (SUBMISSION state)."
    confirm: "หา POST/submission ไปยัง page หรือ sign-in ที่สัมพันธ์กับหน้านั้น ระบุ identities"
    may_be_authorized: false
  - id: ph_unauthorized_oauth_consent
    description: "OAuth app consent/grant that was not approved."
    confirm: "ตรวจ consent audit: client, principal, scopes และยืนยันว่าไม่ได้รับอนุมัติ"
    may_be_authorized: true
  - id: ph_bec_fraudulent_instruction
    description: "Fraudulent business instruction (payment/bank-detail change/request) tied to a business item."
    confirm: "ยืนยันกับผู้มีอำนาจของ business item ผ่านช่องทางอื่นว่าคำสั่งนี้ไม่ใช่ของจริง"
    may_be_authorized: false
  - id: ph_bec_mailbox_abuse
    description: "Mailbox abuse in a BEC case: unauthorized session / forwarding rule / delegate."
    confirm: "ตรวจ mailbox audit: sign-in, rule, delegate ที่ไม่ได้รับอนุญาต"
    may_be_authorized: true

actions:
  - action_id: ACT-MAIL-CAMPAIGN-QUARANTINE
    action_name: Quarantine phishing-attachment campaign messages
    label_th: "กักอีเมลแคมเปญฟิชชิงที่มีไฟล์แนบ"
    objective: "หยุดการเข้าถึง attachment ต่อ messages/mailboxes ที่สัมพันธ์กับ campaign"
    phase: CONTAINMENT
    containment_stage: CLOSE_PATH
    impact_level: MEDIUM
    review_status: IR_REVIEW_PENDING
    supported_target_types: [message_set]
    evidence_requirements: [ph_malicious_attachment_delivered]
    target_requirements: [message_set]
    runbook_refs: [RB-MAIL-CAMPAIGN-QUARANTINE]
    legacy_action_refs: [ACT-QUARANTINE-EMAIL, ACT-BLOCK-SENDER]
    execution_constraints: ["จำกัดเฉพาะ messages ของ campaign", "ไม่ isolate ผู้รับทุกคน", "delivery ไม่เท่ากับ execution"]
  - action_id: ACT-PHISHING-LINK-RESTRICT
    action_name: Restrict phishing link delivery
    label_th: "จำกัดการส่งถึงของลิงก์ฟิชชิง"
    objective: "ตัด delivery ต่อ URL/domain/path และ related messages"
    phase: CONTAINMENT
    containment_stage: CLOSE_PATH
    impact_level: MEDIUM
    review_status: IR_REVIEW_PENDING
    supported_target_types: [url_object, message_set]
    evidence_requirements: [ph_malicious_link_chain]
    target_requirements: [url_object]
    runbook_refs: [RB-PHISHING-LINK-RESTRICT]
    legacy_action_refs: [ACT-BLOCK-URL, ACT-BLOCK-DOMAIN, ACT-QUARANTINE-EMAIL]
    execution_constraints: ["granular ที่สุดที่ control รองรับ", "click ≠ submission"]
  - action_id: ACT-HARVESTING-CONTAIN
    action_name: Contain credential-harvesting page and affected identities
    label_th: "จำกัดหน้าเก็บ credential และ identity ที่ได้รับผลกระทบ"
    objective: "ตัด harvesting และ identity access ต่อ page, accounts, sessions"
    phase: CONTAINMENT
    containment_stage: CLOSE_PATH
    impact_level: MEDIUM
    review_status: IR_REVIEW_PENDING
    supported_target_types: [url_object, message_set, account_identity, session]
    evidence_requirements: [ph_credential_submission]
    target_requirements: [url_object]
    runbook_refs: [RB-HARVESTING-CONTAIN]
    legacy_action_refs: [ACT-BLOCK-URL, ACT-REVOKE-SESSION, ACT-RESET-CREDENTIAL]
    execution_constraints: ["จัดการเฉพาะ identities ที่ submit/ถูกใช้", "password reset ไม่แทน session revocation"]
  - action_id: ACT-OAUTH-GRANT-CONTAIN
    action_name: Contain unauthorized OAuth grant
    label_th: "เพิกถอน OAuth grant ที่ไม่ได้รับอนุญาต"
    objective: "ตัด app access ต่อ client/principal/grant/scopes และ resources ที่เข้าถึง"
    phase: CONTAINMENT
    containment_stage: IDENTITY_EXPOSURE
    impact_level: HIGH
    review_status: IR_REVIEW_PENDING
    supported_target_types: [oauth_grant]
    evidence_requirements: [ph_unauthorized_oauth_consent, ac_oauth_unauthorized_api_calls]
    target_requirements: [oauth_grant]
    runbook_refs: [RB-OAUTH-GRANT-CONTAIN]
    legacy_action_refs: [ACT-REVOKE-SESSION]
    execution_constraints: ["password reset ไม่แทน grant/token revocation", "ไม่แสดง token value"]
  - action_id: ACT-BEC-CONTAIN
    action_name: Contain BEC (business hold by authority, mailbox access by IR)
    label_th: "จำกัด BEC (ระงับธุรกรรมโดยผู้มีอำนาจ และจำกัดการเข้าถึงกล่องจดหมายโดย IR)"
    objective: "หยุดธุรกรรมโดยผู้มีอำนาจ และตัด mailbox session/rule/delegate ที่ไม่ได้รับอนุญาตโดย IR"
    phase: CONTAINMENT
    containment_stage: STOP_ACTIVE
    impact_level: HIGH
    review_status: IR_REVIEW_PENDING
    supported_target_types: [business_item, mailbox_access]
    evidence_requirements: [ph_bec_fraudulent_instruction, ph_bec_mailbox_abuse]
    target_requirements: [business_item]
    runbook_refs: [RB-BEC-CONTAIN]
    legacy_action_refs: []
    execution_constraints: ["business actions เป็น MANUAL ของผู้มีอำนาจ (PH-P4)", "IR ไม่ hold ธุรกรรมแทน"]

playbooks:
  - playbook_id: PBK-PH-ATTACH
    attack_family: PHISHING
    subtype_id: PH-ATTACH
    subtype_name: Attachment
    classification_evidence:
      all_of: [{field: evidence.ph_malicious_attachment_delivered.status, operator: equals, value: PRESENT}]
    insufficient_evidence: ["attachment ถูกส่งถึงแต่ยังไม่ยืนยันว่าอันตราย", "การส่งถึง (delivery) ไม่ใช่ execution"]
    scenarios:
      - scenario_id: SC-PH-ATTACH-DELIVERED
        description: "Delivery: มี attachment อันตรายผูกกับ message/ผู้รับ (ใช้ได้เสมอเมื่อ delivery ยืนยัน; execution ไม่ถูกอนุมานจาก delivery — scenario ถัดไปเปิดเฉพาะเมื่อมี execution evidence)"
        ordered_action_refs:
          - {action_id: ACT-MAIL-CAMPAIGN-QUARANTINE, condition: POLICY_ELIGIBLE, depends_on: [], order_reason: "ตัดการเข้าถึง attachment ในทุก mailbox ของ campaign ก่อนมีผู้เปิดเพิ่ม", parallel_allowed: false, fallback_action: ACT-INVESTIGATE-MISSING-EVIDENCE}
      - scenario_id: SC-PH-ATTACH-EXECUTED
        description: "Execution: มีหลักฐานว่า attachment/payload ถูกรันบน endpoint — เพิ่ม Malware/Process branch ตามหลักฐานของ branch นั้น"
        when: {field: evidence.ph_attachment_executed.status, operator: equals, value: PRESENT}
        ordered_action_refs:
          - {action_id: ACT-MAIL-CAMPAIGN-QUARANTINE, condition: POLICY_ELIGIBLE, depends_on: [], order_reason: "ยังต้องตัด attachment ใน mailbox อื่นของ campaign ควบคู่กับการจัดการ endpoint ที่รันแล้ว", parallel_allowed: true, fallback_action: ACT-INVESTIGATE-MISSING-EVIDENCE}
    policy_refs: [POL-PH-001, POL-PH-006]
    related_branches: *exec_branch_open
    stop_escalation:
      - {when: {field: evidence.ph_attachment_executed.status, operator: equals, value: PRESENT}, then: ESCALATE_IR, note: "มี execution — แจ้ง IR เพื่อประเมิน endpoint ที่เกี่ยวข้อง"}
    version: "2.0.0"
    provenance: *prov

  - playbook_id: PBK-PH-LINK
    attack_family: PHISHING
    subtype_id: PH-LINK
    subtype_name: Malicious Link
    classification_evidence:
      all_of: [{field: evidence.ph_malicious_link_chain.status, operator: equals, value: PRESENT}]
    insufficient_evidence: ["URL เพียงแต่ดูแปลกโดยไม่ยืนยัน chain อันตราย", "click ไม่เท่ากับ credential submission"]
    scenarios:
      - scenario_id: SC-PH-LINK-DELIVERED
        description: "Delivery/click: chain ลิงก์อันตรายถูกยืนยัน (อาจมีผู้คลิก) แต่ยังไม่มีหลักฐาน submission"
        ordered_action_refs:
          - {action_id: ACT-PHISHING-LINK-RESTRICT, condition: POLICY_ELIGIBLE, depends_on: [], order_reason: "ตัด delivery ของลิงก์ที่ mail/web control และ quarantine messages ตาม campaign", parallel_allowed: false, fallback_action: ACT-INVESTIGATE-MISSING-EVIDENCE}
    policy_refs: [POL-PH-002]
    related_branches:
      - {subtype_id: PH-CREDS, open_when: {field: evidence.ph_credential_submission.status, operator: equals, value: PRESENT}}
    stop_escalation:
      - {when: {field: evidence.ph_credential_submission.status, operator: equals, value: PRESENT}, then: ESCALATE_IR, note: "มี submission — เปิด branch Credential Harvesting"}
    version: "2.0.0"
    provenance: *prov

  - playbook_id: PBK-PH-CREDS
    attack_family: PHISHING
    subtype_id: PH-CREDS
    subtype_name: Credential Harvesting
    classification_evidence:
      all_of: [{field: evidence.ph_credential_submission.status, operator: equals, value: PRESENT}]
    insufficient_evidence: ["ผู้ใช้เพียงคลิกลิงก์ (click ≠ submission)", "ไม่ทราบ identity ที่ submit"]
    scenarios:
      - scenario_id: SC-PH-CREDS-SUBMITTED
        description: "Submission: มี credential submission หรือ identity abuse ที่สัมพันธ์กับ page"
        ordered_action_refs:
          - {action_id: ACT-HARVESTING-CONTAIN, condition: POLICY_ELIGIBLE, depends_on: [], order_reason: "ปิด page/messages เพื่อหยุด harvesting แล้ว revoke sessions ก่อนจัดการ credential (reset ไม่ทำให้ session เดิมหมด)", parallel_allowed: false, fallback_action: ACT-INVESTIGATE-MISSING-EVIDENCE}
    policy_refs: [POL-PH-003]
    related_branches:
      - {subtype_id: AC-PASSWORD, open_when: {all_of: [{field: evidence.ac_unauthorized_password_auth.status, operator: equals, value: PRESENT}, {field: evidence.ac_unauthorized_password_auth.authorization_status, operator: equals, value: UNAUTHORIZED}]}}
    stop_escalation:
      - {when: {field: scope.treats_delivery_as_execution, operator: equals, value: true}, then: STOP, note: "ห้ามอนุมาน submission จาก delivery/click"}
    version: "2.0.0"
    provenance: *prov

  - playbook_id: PBK-PH-CONSENT
    attack_family: PHISHING
    subtype_id: PH-CONSENT
    subtype_name: OAuth Consent
    classification_evidence:
      all_of:
        - {field: evidence.ph_unauthorized_oauth_consent.status, operator: equals, value: PRESENT}
        - {field: evidence.ph_unauthorized_oauth_consent.authorization_status, operator: equals, value: UNAUTHORIZED}
    insufficient_evidence: ["app ขอ scope สูงแต่ยังไม่ยืนยันว่า consent ไม่ได้รับอนุมัติ", "app อยู่ใน approved list"]
    scenarios:
      - scenario_id: SC-PH-CONSENT-UNAUTHORIZED
        description: "มี consent/grant ที่ไม่ได้รับอนุมัติ ต้องตัด app access ที่ grant/scopes"
        ordered_action_refs:
          - {action_id: ACT-OAUTH-GRANT-CONTAIN, condition: POLICY_ELIGIBLE, depends_on: [], order_reason: "ถอน grant ก่อน; password reset ไม่ยกเลิก grant/token", parallel_allowed: false, fallback_action: ACT-INVESTIGATE-MISSING-EVIDENCE}
    policy_refs: [POL-PH-004]
    related_branches:
      - {subtype_id: AC-OAUTH, open_when: {all_of: [{field: evidence.ac_oauth_unauthorized_api_calls.status, operator: equals, value: PRESENT}, {field: evidence.ac_oauth_unauthorized_api_calls.authorization_status, operator: equals, value: UNAUTHORIZED}]}}
    stop_escalation:
      - {when: {field: scope.is_approved_automation, operator: equals, value: true}, then: STOP, note: "application อยู่ใน approved list"}
    version: "2.0.0"
    provenance: *prov

  - playbook_id: PBK-PH-BEC
    attack_family: PHISHING
    subtype_id: PH-BEC
    subtype_name: BEC
    classification_evidence:
      all_of: [{field: evidence.ph_bec_fraudulent_instruction.status, operator: equals, value: PRESENT}]
    insufficient_evidence: ["อีเมลคำขอที่ผิดปกติแต่ยังไม่ยืนยันว่าเป็นคำสั่งปลอม", "ไม่ทราบ business item / ผู้มีอำนาจ"]
    scenarios:
      - scenario_id: SC-PH-BEC-INSTRUCTION
        description: "มีคำสั่งธุรกิจที่ฉ้อฉล; mailbox abuse เป็นส่วนเสริมหากมีหลักฐาน"
        ordered_action_refs:
          - {action_id: ACT-BEC-CONTAIN, condition: POLICY_ELIGIBLE, depends_on: [], order_reason: "ธุรกรรมอาจจ่ายเงินทันที จึงขอให้ผู้มีอำนาจ hold ก่อนเป็นขั้นแรก ขณะที่ IR ตัด mailbox access", parallel_allowed: false, fallback_action: ACT-INVESTIGATE-MISSING-EVIDENCE}
    policy_refs: [POL-PH-005]
    related_branches:
      - {subtype_id: AC-PASSWORD, open_when: {all_of: [{field: evidence.ac_unauthorized_password_auth.status, operator: equals, value: PRESENT}, {field: evidence.ac_unauthorized_password_auth.authorization_status, operator: equals, value: UNAUTHORIZED}]}}
      - {subtype_id: AC-SESSION, open_when: {all_of: [{field: evidence.ac_session_replay_unauthorized.status, operator: equals, value: PRESENT}, {field: evidence.ac_session_replay_unauthorized.authorization_status, operator: equals, value: UNAUTHORIZED}]}}
    stop_escalation:
      - {when: {field: evidence.ph_bec_fraudulent_instruction.status, operator: equals, value: PRESENT}, then: MANUAL_OWNER, note: "ธุรกรรมต้องได้รับการ hold โดยผู้มีอำนาจของ business item"}
    version: "2.0.0"
    provenance: *prov

policies:
  - policy_id: POL-PH-001
    rule_type: ACTION_GATE
    action_id: ACT-MAIL-CAMPAIGN-QUARANTINE
    applicable_subtypes: [PH-ATTACH]
    covers: [PH-P1, PH-P2]
    required_evidence:
      all_of: [{field: evidence.ph_malicious_attachment_delivered.status, operator: equals, value: PRESENT}]
    required_targets:
      all_of: [{field: targets.message_set.validated, operator: equals, value: true}]
    prohibitions:
      - {id: PRH-PH-1, reason: "ห้าม isolate/ลงโทษผู้รับทุกคนที่ได้รับข้อความ (PH-P2)", when: {field: scope.targets_all_recipients, operator: equals, value: true}}
      - {id: PRH-PH-2, reason: "delivery ไม่เท่ากับ execution — ห้ามอนุมานสถานะ execution (PH-P1)", when: {field: scope.treats_delivery_as_execution, operator: equals, value: true}}
    authorization_gate: []
    authority_requirements: {all_of: []}
    tool_capability_requirements: [cap.mail_quarantine]
    criticality_constraints: []
    fallback: {action_id: ACT-INVESTIGATE-MISSING-EVIDENCE, when: "ยังไม่ยืนยันว่า attachment อันตรายหรือระบุ message set ไม่ได้"}
    reason: "ระดับ delivery: quarantine messages ของ campaign เท่านั้น"
    provenance: {reference: [PH-ATTACH, PH-P1, PH-P2]}

  - policy_id: POL-PH-002
    rule_type: ACTION_GATE
    action_id: ACT-PHISHING-LINK-RESTRICT
    applicable_subtypes: [PH-LINK]
    covers: [PH-P1, C2-P2]
    required_evidence:
      all_of: [{field: evidence.ph_malicious_link_chain.status, operator: equals, value: PRESENT}]
    required_targets:
      all_of: [{field: targets.url_object.validated, operator: equals, value: true}]
    prohibitions:
      - {id: PRH-PH-3, reason: "ห้าม block ทั้ง CDN/provider เมื่อ control ระดับ path/domain ทำได้", when: {field: scope.shared_infra_coarse_block, operator: equals, value: true}}
      - {id: PRH-PH-4, reason: "click ไม่เท่ากับ submission/execution — ห้ามอนุมานสถานะที่สูงกว่า (PH-P1)", when: {field: scope.treats_delivery_as_execution, operator: equals, value: true}}
    authorization_gate: []
    authority_requirements: {all_of: []}
    tool_capability_requirements: [cap.mail_web_link_control]
    criticality_constraints: []
    fallback: {action_id: ACT-INVESTIGATE-MISSING-EVIDENCE, when: "ยังไม่ยืนยัน chain หรือ granularity ของ URL"}
    reason: "ตัด delivery ต่อ URL/domain/path ที่ยืนยันและ quarantine messages ที่เกี่ยวข้อง"
    provenance: {reference: [PH-LINK, PH-P1]}

  - policy_id: POL-PH-003
    rule_type: ACTION_GATE
    action_id: ACT-HARVESTING-CONTAIN
    applicable_subtypes: [PH-CREDS]
    covers: [PH-P1, PH-P5, PH-P2]
    required_evidence:
      all_of: [{field: evidence.ph_credential_submission.status, operator: equals, value: PRESENT}]
    required_targets:
      all_of: [{field: targets.url_object.validated, operator: equals, value: true}]
    prohibitions:
      - {id: PRH-PH-5, reason: "ห้ามอนุมาน submission จาก delivery/click (PH-P1)", when: {field: scope.treats_delivery_as_execution, operator: equals, value: true}}
      - {id: PRH-PH-6, reason: "password reset ไม่แทน session/token revocation (PH-P5)", when: {field: scope.password_reset_as_only_revocation, operator: equals, value: true}}
    authorization_gate: []
    authority_requirements: {all_of: []}
    tool_capability_requirements: [cap.mail_web_link_control]
    criticality_constraints: []
    fallback: {action_id: ACT-INVESTIGATE-MISSING-EVIDENCE, when: "ยังระบุ page หรือ identities ที่ submit ไม่ได้"}
    reason: "Submission: ปิด page แล้ว revoke sessions และจัดการ credential เฉพาะ identities ที่เกี่ยวข้อง"
    provenance: {reference: [PH-CREDS, PH-P1, PH-P5]}

  - policy_id: POL-PH-004
    rule_type: ACTION_GATE
    action_id: ACT-OAUTH-GRANT-CONTAIN
    applicable_subtypes: [PH-CONSENT]
    covers: [PH-P5]
    required_evidence:
      all_of: [{field: evidence.ph_unauthorized_oauth_consent.status, operator: equals, value: PRESENT}]
    required_targets:
      all_of: [{field: targets.oauth_grant.validated, operator: equals, value: true}]
    prohibitions:
      - {id: PRH-PH-7, reason: "password reset ไม่ใช่ทางแทน OAuth grant revocation (PH-P5)", when: {field: scope.password_reset_as_only_revocation, operator: equals, value: true}}
    authorization_gate: [ph_unauthorized_oauth_consent]
    authority_requirements: {all_of: []}
    tool_capability_requirements: [cap.oauth_grant_revocation]
    criticality_constraints: []
