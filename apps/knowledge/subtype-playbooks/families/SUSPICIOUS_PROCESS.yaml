        method: "เพิ่ม targeted rule ที่ {{web_route.control_point}} เฉพาะ {{web_route.route}} / {{web_route.parameter}} ของ {{web_route.application}} เพื่อจำกัดเส้นทางเข้าที่ใช้สั่งคำสั่งบนเครื่อง (OS command injection จัดการที่ขั้นตอนนี้ ไม่ใช่ขั้นตอน SQLi) เริ่มในโหมด detect/log เทียบกับ traffic ปกติ แล้วเปลี่ยนเป็น block หลังผ่านการตรวจและได้รับอนุมัติตามที่องค์กรกำหนด ตรวจว่า log แสดงการจำกัดตาม pattern และอัตรา error ของ route ปกติไม่เพิ่ม"
