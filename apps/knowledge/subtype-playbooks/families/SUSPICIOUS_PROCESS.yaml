        method_basis: NEUTRAL_DERIVED
        condition: {all_of: [{field: targets.network_flow.validated, operator: equals, value: true}, {field: capability.cap.scoped_network_enforcement.supported, operator: equals, value: true}]}
        expected_result: "channel ใช้ไม่ได้"
