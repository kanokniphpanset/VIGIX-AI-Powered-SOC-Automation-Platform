        instruction: "เนื่องจาก {{process.host_id}} เป็น workload สำคัญ: คง DNS rule ที่ตั้งไว้แล้ว และขออนุมัติ asset owner ก่อนยุติ process (ตัวระบุ Process: {{process.process_identity}})"
        method: "ส่งคำขออนุมัติให้ asset owner ของ {{process.host_id}} พร้อมตัวระบุ Process ข้างต้น เหตุผล และผลกระทบต่อบริการ ห้ามยุติ process จนกว่าจะได้รับอนุมัติ ระหว่างรอให้คงการจำกัดที่ตั้งไว้แล้ว เมื่ออนุมัติแล้วจึงยุติตามขั้นยุติ process (ตรวจก่อนยุติ ไม่ยุติซ้ำ)"
        method_basis: NEUTRAL_DERIVED
        condition: {all_of: [{field: targets.process.validated, operator: equals, value: true}]}
        expected_result: "DNS channel ถูกตัดโดยบริการหลักยังทำงาน"
        verify: "ไม่มี query ใหม่ไป domain ที่ระบุ"
        on_failure: "escalate IR/asset owner"
      - step_id: S5
        title: "ยุติ process (ตัวระบุ Process: {{process.process_identity}}) บน {{process.host_id}} ที่ส่ง DNS"
        origin: EXPANDED_FROM_REFERENCE
        operation: terminate_process
        operates_on: process
        variant: standard
        instruction: "ยุติ process (ตัวระบุ Process: {{process.process_identity}}) บน {{process.host_id}} ที่ส่ง DNS ดังกล่าว (ระบุด้วย process identity)"
        method: "ตรวจก่อนว่า process ตามตัวระบุ Process ข้างต้นยังรันอยู่บน {{process.host_id}} ถ้ายังรันจึงยุติเฉพาะ process นั้นด้วยตัวระบุ Process (ไม่ใช้ PID หรือชื่อ process อย่างเดียว) แล้วตรวจว่าไม่ถูกสร้างขึ้นใหม่ ถ้าไม่พบแล้วให้บันทึกผลการตรวจและไม่ยุติซ้ำ"
        method_basis: NEUTRAL_DERIVED
        condition: {all_of: [{field: targets.process.validated, operator: equals, value: true}, {field: capability.cap.process_termination.supported, operator: equals, value: true}]}
        expected_result: "process หยุดทำงาน"
        verify: "process identity ไม่อยู่ใน list และไม่มี query ใหม่"
        on_failure: "restrict host ตาม scope และ escalate IR"
      - step_id: S6
        kind: verify
        origin: EXPANDED_FROM_REFERENCE
        instruction: "ตรวจ DNS log ว่าไม่มี query ใหม่ไป {{dns_channel.domains}} และ approved DNS ทำงานปกติ"
        expected_result: "ไม่มี DNS channel ใหม่"
        verify: "re-hunt domain/host ในช่วงเฝ้าระวัง"
        on_failure: "เพิ่ม domain ใหม่เฉพาะที่มี evidence"
    verification: ["ไม่มี query ไป domain ที่ระบุ", "approved DNS ใช้ได้ตามปกติ"]
    failure_handling: ["domain ใหม่ → เพิ่มเฉพาะที่ผูกกับ process/host เดียวกัน"]
    rollback: ["ถอน rule จาก snapshot"]
