    failure_handling: ["พบ flow อื่นจาก process เดียวกัน → เพิ่มเฉพาะที่มี evidence"]
    rollback: ["ถอน rule จาก snapshot"]
    variants: [{variant_id: critical_workload, description: "ตัด flow ที่ระบุเท่านั้น และขออนุมัติ asset owner ก่อนยุติ process บน workload สำคัญ"}]

  - runbook_id: RB-RMM-ACCESS-CONTAIN
    review_status: IR_REVIEW_PENDING
    supported_action_ids: [ACT-RMM-ACCESS-CONTAIN]
    supported_subtypes: [C2-RMM]
    objective: "Terminate session, revoke scoped registration/access และ disable identified service หากจำเป็น โดยรักษา trusted IR access"
    prerequisites: ["inventory ของ RMM ที่อนุมัติ", "host/session/registration ที่ระบุ", "ช่องทาง IR ที่เชื่อถือได้ที่ต้องรักษา"]
    required_evidence: [c2_rmm_unauthorized]
    required_targets: [rmm_registration]
    required_capabilities: [cap.rmm_console_control, cap.process_termination]
    tool_variants: *neutral
    required_authority: [ir_execute]
    operational_impact: "การควบคุมระยะไกลด้วยเครื่องมือนี้บน host ที่ระบุหยุด; RMM/IR access ที่ได้รับอนุมัติไม่ถูกตัด"
    ordered_steps:
      - step_id: S1
        origin: EXPANDED_FROM_REFERENCE
        fold: true
        instruction: "ยืนยันว่า {{rmm_registration.tool}} บน {{rmm_registration.host_id}} (registration/session {{rmm_registration.registration_or_session_id}}) ไม่อยู่ใน inventory ของ RMM ที่อนุมัติ และไม่ใช่ช่องทาง IR ที่เชื่อถือได้"
        expected_result: "ยืนยันว่าเป็น RMM ที่ไม่ได้รับอนุญาต"
        verify: "เทียบกับ approved RMM inventory และ change record"
        on_failure: "ไม่ดำเนินการ; ไป investigation"
      - step_id: S2
        title: "Terminate session {{rmm_registration.registration_or_session_id}} ของ {{rmm_registration.tool}} บน {{rmm_registration.host_id}}"
        origin: EXPANDED_FROM_REFERENCE
        instruction: "Terminate session {{rmm_registration.registration_or_session_id}} ของ {{rmm_registration.tool}} บน {{rmm_registration.host_id}}"
        method: "ใช้ console ของ {{rmm_registration.tool}} หา session {{rmm_registration.registration_or_session_id}} ของ {{rmm_registration.host_id}} แล้วสั่ง terminate เฉพาะ session นั้น (ไม่แตะ registration ที่ได้รับอนุมัติ) ตรวจจากรายการ active ว่า session หายไป"
        method_basis: NEUTRAL_DERIVED
        condition: {all_of: [{field: capability.cap.rmm_console_control.supported, operator: equals, value: true}]}
        expected_result: "session หยุด"
        verify: "session ไม่อยู่ในรายการ active ของ RMM console"
        on_failure: "ยุติ process/service ของ tool ใน S4"
      - step_id: S3
        title: "Revoke registration {{rmm_registration.registration_or_session_id}} ที่ {{rmm_registration.tenant_or_console}}"
        origin: EXPANDED_FROM_REFERENCE
        instruction: "Revoke registration/access {{rmm_registration.registration_or_session_id}} ที่ {{rmm_registration.tenant_or_console}} เฉพาะรายการนี้"
        method: "ใน console ของ tenant {{rmm_registration.tenant_or_console}} เพิกถอนเฉพาะ registration หรือ access {{rmm_registration.registration_or_session_id}} (ไม่ลบ tenant หรือ registration อื่น) บันทึกสถานะก่อนถอน แล้วตรวจว่าสถานะเป็น revoked"
        method_basis: NEUTRAL_DERIVED
        condition: {all_of: [{field: capability.cap.rmm_console_control.supported, operator: equals, value: true}]}
        expected_result: "agent/registration นี้ reconnect ไม่ได้"
        verify: "registration ไม่ปรากฏใน console หรือสถานะ revoked"
        on_failure: "disable service ของ tool ใน S4"
        rollback: "ลงทะเบียนใหม่ผ่านกระบวนการอนุมัติหากพบว่าเป็น false positive"
      - step_id: S4
        title: "Disable service {{rmm_registration.service_name}} ของ {{rmm_registration.tool}} บน {{rmm_registration.host_id}}"
        origin: EXPANDED_FROM_REFERENCE
        instruction: "Disable service {{rmm_registration.service_name}} ของ tool บน {{rmm_registration.host_id}} เมื่อ revoke ที่ console ไม่เพียงพอ (เฉพาะ service นี้)"
        method: "บน {{rmm_registration.host_id}} ปิด (disable) เฉพาะ service {{rmm_registration.service_name}} ของ tool ด้วยเครื่องมือจัดการ service ของเครื่อง หลังยืนยันว่าการถอน registration ที่ console ไม่เพียงพอ ตรวจว่า service เป็น disabled และไม่มี connection ไปยังเซิร์ฟเวอร์ของ tool"
        method_basis: NEUTRAL_DERIVED
        condition: {all_of: [{field: capability.cap.process_termination.supported, operator: equals, value: true}]}
        expected_result: "tool ไม่ทำงานบน host"
        verify: "service เป็น disabled และไม่มี connection ไป RMM server"
        on_failure: "restrict host ตาม scope และ escalate IR"
        rollback: "enable service ตาม configuration snapshot ถ้า IR ยืนยัน false positive"
      - step_id: S5
        kind: verify
        origin: EXPANDED_FROM_REFERENCE
        instruction: "ตรวจว่า {{rmm_registration.tool}} ไม่ reconnect และ trusted IR access ของ {{rmm_registration.host_id}} ยังใช้ได้"
        expected_result: "ไม่มี reconnect และ IR access ปกติ"
        verify: "re-hunt tool connection และทดสอบ IR access"
        on_failure: "ตรวจ tool/registration อื่นที่มี evidence"
    verification: ["ไม่มี session/registration ที่ไม่ได้รับอนุญาต", "trusted IR access ยังใช้ได้"]
    failure_handling: ["พบ tool อื่น → ประเมินแยกตาม inventory ไม่ตัดทุก RMM"]
    rollback: ["ลงทะเบียน/enable ใหม่ตามกระบวนการอนุมัติ"]
