        instruction: "จำกัด management path {{remote_session.protocol}} จาก {{remote_session.source_host_id}} ไป {{remote_session.destination_host_id}} เท่านั้น (ไม่ปิด remoting ทั้งองค์กรและคง approved management/IR access)"
        method: "จำกัดเฉพาะ management path {{remote_session.protocol}} จาก {{remote_session.source_host_id}} ไป {{remote_session.destination_host_id}} ที่จุดบังคับเครือข่าย (ไม่ปิด remoting ทั้งองค์กร) โดยคง approved management/IR access ตามรายการขององค์กร (ตรวจรายการก่อน) บันทึก rule เดิมก่อนแก้ แล้วตรวจจาก log ว่า attempt ใหม่ถูกปฏิเสธ"
