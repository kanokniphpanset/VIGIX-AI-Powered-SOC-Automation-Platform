        operation: terminate_children
        operates_on: process_children
        instruction: "ยุติ child process (ตัวระบุ Process ลูก: {{process_children.child_process_identities}}) ของ (ตัวระบุ Process: {{process.process_identity}}) เฉพาะรายการที่มี lineage เชื่อมโยง"
