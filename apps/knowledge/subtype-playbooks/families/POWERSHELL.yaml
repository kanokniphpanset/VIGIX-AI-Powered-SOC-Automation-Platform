    supported_subtypes: [PS-PERSIST, MAL-BACKDOOR, PS-REMOTE]
    objective: "เก็บ artifact configuration, disable trigger ที่ระบุ, หยุด running instance และ processes ที่มันเริ่ม"
    prerequisites: ["artifact ที่ผูกกับ relaunch ระบุได้ (host + type + locator)", "ตรวจแล้วว่าการแก้/ใช้ artifact ไม่ได้รับอนุมัติ"]
    required_evidence: [ps_persistence_relaunch]
    required_targets: [persistence_artifact]
    required_capabilities: [cap.persistence_trigger_disable, cap.process_termination, cap.config_snapshot]
    tool_variants: *neutral
    required_authority: [ir_execute]
    operational_impact: "งานที่ถูก disable จะไม่ทำงานตามรอบ ถ้า task ใช้ร่วมกับงานจริง ต้องตรวจก่อน"
    ordered_steps:
      - step_id: S1
        origin: EXPANDED_FROM_REFERENCE
        fold: true
        instruction: "ตรวจว่า {{persistence_artifact.artifact_locator}} ({{persistence_artifact.artifact_type}}) บน {{persistence_artifact.host_id}} เป็น artifact ที่ผูกกับ payload execution ตาม evidence และการแก้ไม่อยู่ใน change record ที่อนุมัติ — ไม่แตะ artifact อื่น"
        expected_result: "ยืนยัน artifact ที่ต้อง disable เป็นรายการเดียว"
        verify: "เทียบ evidence ref และ change record"
        on_failure: "ไม่ disable; คงสถานะ NEEDS_EVIDENCE"
      - step_id: S2
        origin: EXPANDED_FROM_REFERENCE
        fold: true
        instruction: "บันทึก configuration ปัจจุบันของ {{persistence_artifact.artifact_locator}} (definition, actions, trigger, run-as account, ACL) ก่อนแก้"
        condition: {all_of: [{field: capability.cap.config_snapshot.supported, operator: equals, value: true}]}
        expected_result: "มี snapshot สำหรับ forensic/rollback"
        verify: "snapshot เก็บใน incident record"
        on_failure: "บันทึกด้วยมือ (screenshot/export) แล้วค่อยแก้"
      - step_id: S3
        title: "Disable {{persistence_artifact.artifact_locator}} ({{persistence_artifact.artifact_type}}) บน {{persistence_artifact.host_id}}"
        origin: EXPANDED_FROM_REFERENCE
        instruction: "Disable {{persistence_artifact.artifact_locator}} ({{persistence_artifact.artifact_type}}) บน {{persistence_artifact.host_id}} เฉพาะรายการนี้ (ไม่ลบ ไม่ปิด scheduler/service manager ทั้งเครื่อง)"
        method_basis: EXISTING
        method: "ใช้เครื่องมือจัดการ task/service ของเครื่อง {{persistence_artifact.host_id}} สั่ง disable เฉพาะ {{persistence_artifact.artifact_locator}} (ไม่ลบรายการ และไม่ปิด scheduler/service manager ทั้งเครื่อง) แล้วตรวจสถานะว่าเป็น disabled"
        condition: {all_of: [{field: capability.cap.persistence_trigger_disable.supported, operator: equals, value: true}]}
        expected_result: "artifact ไม่เรียก payload ตามรอบอีก"
        verify: "สถานะ artifact เป็น disabled และรอบ trigger ถัดไปไม่ทำงาน"
        on_failure: "ปิดการเรียก payload ด้วยการ restrict path/permission ที่ artifact ชี้ แล้ว escalate IR"
        rollback: "enable กลับด้วย configuration snapshot หาก IR ยืนยัน false positive"
        impact: "งานตามรอบของ artifact นี้ไม่ทำงาน"
      - step_id: S4
        title: "หยุด instance ของ {{persistence_artifact.artifact_locator}} ที่กำลังรันอยู่"
        origin: EXPANDED_FROM_REFERENCE
        instruction: "หยุด instance ของ {{persistence_artifact.artifact_locator}} ที่กำลังรันอยู่ (การ disable ไม่ได้หยุด instance ที่ทำงานแล้ว)"
        method_basis: EXISTING
        needs_prior: [S3]
        method: "ตรวจสถานะของ {{persistence_artifact.artifact_locator}} ก่อน ถ้ายังเป็น running ให้ใช้เครื่องมือจัดการ task/service หยุดเฉพาะ instance นั้น (การ disable ไม่หยุด instance ที่ทำงานอยู่แล้ว)"
        condition: {all_of: [{field: capability.cap.persistence_trigger_disable.supported, operator: equals, value: true}]}
        expected_result: "ไม่มี running instance ของ artifact"
        verify: "สถานะ artifact ไม่เป็น running"
        on_failure: "ยุติ payload ด้วย process identity ใน S5"
      - step_id: S5
        title: "ยุติ payload process (ตัวระบุ Process: {{process.process_identity}}) บน {{process.host_id}}"
        origin: EXPANDED_FROM_REFERENCE
        operation: terminate_process
        operates_on: process
        instruction: "ยุติ payload process (ตัวระบุ Process: {{process.process_identity}}) บน {{process.host_id}} เฉพาะที่ยังรันอยู่ (ระบุด้วย process identity ไม่ใช้ PID อย่างเดียว; หากการหยุด instance ข้างต้นยุติ payload ไปแล้วให้ตรวจและยุติเฉพาะที่ยังเหลือ)"
        method_basis: EXISTING
        method: "ตรวจก่อนว่า process ตามตัวระบุข้างต้นยังรันอยู่ ถ้ายังรันจึงยุติเฉพาะ process นั้นด้วยตัวระบุ Process (ไม่ใช้ PID อย่างเดียว) ถ้าการหยุด instance ในขั้นก่อนหน้ายุติ payload ไปแล้วให้บันทึกผลการตรวจและไม่ยุติซ้ำ"
        condition: {all_of: [{field: targets.process.validated, operator: equals, value: true}, {field: capability.cap.process_termination.supported, operator: equals, value: true}]}
        expected_result: "ไม่มี payload process ที่ validate เหลืออยู่"
        verify: "ไม่พบ Process ตามตัวระบุข้างต้นใน process list"
        on_failure: "restrict workload ตาม scope และ escalate IR"
      - step_id: S6
        title: "ยุติ child process (ตัวระบุ Process ลูก: {{process_children.child_process_identities}}) ของ payload"
        origin: EXPANDED_FROM_REFERENCE
        operation: terminate_children
        operates_on: process_children
        instruction: "ยุติ child process (ตัวระบุ Process ลูก: {{process_children.child_process_identities}}) ของ payload เฉพาะรายการที่มี lineage เชื่อมโยงกับ (ตัวระบุ Process: {{process.process_identity}}) (ไม่ยุติ child ที่ไม่มีหลักฐาน)"
        method: "ยุติเฉพาะ child process ตามตัวระบุ Process ลูกข้างต้นที่มีหลักฐาน lineage เชื่อมกับ process หลัก และตรวจก่อนว่ายังรันอยู่ ไม่ยุติ process อื่นที่ไม่มีหลักฐาน แล้วตรวจว่าไม่มี child ใหม่จาก process หลัก"
        method_basis: NEUTRAL_DERIVED
        condition: {all_of: [{field: targets.process.validated, operator: equals, value: true}, {field: targets.process_children.validated, operator: equals, value: true}, {field: capability.cap.process_termination.supported, operator: equals, value: true}]}
        expected_result: "children ที่ validate หยุด"
        verify: "children ไม่อยู่ใน process list"
        on_failure: "ตรวจ lineage เพิ่มก่อนยุติ"
      - step_id: S7
        kind: verify
        origin: EXPANDED_FROM_REFERENCE
        instruction: "ตรวจหลังรอบ trigger ถัดไปว่า {{persistence_artifact.artifact_locator}} ไม่ relaunch payload และไม่มี process ใหม่จาก artifact นี้"
        expected_result: "ไม่มี relaunch"
        verify: "re-hunt process creation จาก artifact ในช่วงเฝ้าระวัง"
        on_failure: "ตรวจ persistence อื่นที่มีหลักฐาน (ไม่ disable ทั้งชุด)"
    verification: ["artifact ที่ระบุ disabled และไม่ relaunch", "ไม่มี payload process/children (ที่ validate) เหลือ"]
    failure_handling: ["พบ trigger อื่นที่ relaunch → ระบุจากหลักฐานแล้วทำซ้ำเฉพาะรายการนั้น"]
    rollback: ["enable artifact ตาม configuration snapshot ตาม IR approval"]
