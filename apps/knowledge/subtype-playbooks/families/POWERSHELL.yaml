  - runbook_id: RB-REMOTE-SESSION-CONTAIN
    review_status: IR_REVIEW_PENDING
    supported_action_ids: [ACT-REMOTE-SESSION-CONTAIN]
    supported_subtypes: [PS-REMOTE]
    objective: "Terminate session จำกัด management path source→destination และ contain effects ที่ปลายทาง"
    prerequisites: ["session id, source, destination, account, protocol", "รายการ approved management/IR access"]
    required_evidence: [ps_remote_execution_unauthorized]
    required_targets: [remote_session]
    required_capabilities: [cap.remote_session_termination, cap.scoped_network_enforcement, cap.process_termination]
    tool_variants: *neutral
    required_authority: [ir_execute]
    operational_impact: "การจัดการจากระยะไกลระหว่าง source→destination นี้ใช้ไม่ได้ จนกว่า IR อนุมัติ"
    ordered_steps:
      - step_id: S1
        origin: EXPANDED_FROM_REFERENCE
        fold: true
        instruction: "ยืนยัน session {{remote_session.session_id}} จาก {{remote_session.source_host_id}} ไป {{remote_session.destination_host_id}} (บัญชี {{remote_session.account_id}}, {{remote_session.protocol}}) ไม่ใช่ management/IR access ที่อนุมัติ"
        expected_result: "session ไม่ได้รับอนุญาตตามหลักฐาน"
        verify: "เทียบกับรายการ approved management access"
        on_failure: "ไม่ยุติ; คงสถานะ NEEDS_EVIDENCE"
      - step_id: S2
        title: "ยุติ remote session {{remote_session.session_id}} บน {{remote_session.destination_host_id}}"
        origin: EXPANDED_FROM_REFERENCE
        instruction: "ยุติ remote session {{remote_session.session_id}} บน {{remote_session.destination_host_id}}"
        method: "ใช้เครื่องมือจัดการ remote session ของ {{remote_session.destination_host_id}} หา session {{remote_session.session_id}} แล้วยุติเฉพาะ session นั้น บันทึกรายละเอียดก่อนยุติ แล้วตรวจว่าไม่อยู่ในรายการ session ที่ active"
