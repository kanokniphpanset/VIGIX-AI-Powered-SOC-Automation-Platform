        instruction: "ตรวจ log ว่าไม่มี remote session ใหม่จาก {{remote_session.source_host_id}} ด้วยบัญชี {{remote_session.account_id}}; หากพบ authentication ที่ไม่ได้รับอนุญาต ให้ประเมิน Account Compromise ของบัญชีนั้น"
        expected_result: "ไม่มี session ใหม่"
        verify: "re-hunt remoting events ในช่วงเฝ้าระวัง"
        on_failure: "ขยาย scope ตามหลักฐานใหม่เท่านั้น"
    verification: ["session ที่ระบุหยุด", "ไม่มี remoting ใหม่ผ่าน path ที่จำกัด"]
    failure_handling: ["พบ source ใหม่ → เพิ่ม path ตามหลักฐาน ไม่ปิด remote management ทั้งองค์กร"]
    rollback: ["ถอน management restriction ตาม IR approval"]

