        expected_result: "source ใช้ path นี้เข้า destination ไม่ได้"
        verify: "attempt ใหม่ถูกปฏิเสธตาม log"
        on_failure: "escalate IR"
        rollback: "ถอน rule ตาม snapshot"
        impact: "การ management ระหว่างคู่ source/destination นี้หยุดชั่วคราว"
      - step_id: S4
        title: "ยุติ process (ตัวระบุ Process: {{process.process_identity}}) บน {{process.host_id}} ที่เกิดจาก session นี้"
        origin: EXPANDED_FROM_REFERENCE
        operation: terminate_process
        operates_on: process
        instruction: "ยุติ process (ตัวระบุ Process: {{process.process_identity}}) บน {{process.host_id}} ที่ถูกสร้างจาก session นี้ (ระบุด้วย process identity)"
        method: "ตรวจก่อนว่า process ตามตัวระบุ Process ข้างต้นยังรันอยู่บน {{process.host_id}} ถ้ายังรันจึงยุติเฉพาะ process นั้นด้วยตัวระบุ Process (ไม่ใช้ PID หรือชื่อ process อย่างเดียว) แล้วตรวจว่าไม่ถูกสร้างขึ้นใหม่ ถ้าไม่พบแล้วให้บันทึกผลการตรวจและไม่ยุติซ้ำ (เฉพาะ process ที่ถูกสร้างจาก session นี้)"
        method_basis: NEUTRAL_DERIVED
        condition: {all_of: [{field: targets.process.validated, operator: equals, value: true}, {field: capability.cap.process_termination.supported, operator: equals, value: true}]}
        expected_result: "process จาก remote command หยุด"
        verify: "ไม่อยู่ใน process list"
        on_failure: "escalate IR"
