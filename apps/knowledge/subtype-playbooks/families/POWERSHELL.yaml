        method: "ตั้งการจำกัดที่ web/DNS/egress control ที่ตัดได้ตรงระดับ {{destination_endpoint.granularity}} สำหรับ {{destination_endpoint.destination}} (ถ้าเป็น shared cloud/CDN ห้าม block ทั้ง provider; ระดับ URL path ต้องใช้เครื่องมือที่เห็น URL path และ DNS control ตัดได้เพียงระดับ domain) บันทึก rule เดิมก่อนแก้ แล้วตรวจจาก log ว่า request ถูกปฏิเสธ ถ้าตัดได้เพียงระดับกว้างกว่าให้แจ้ง IR ก่อนลงมือ"
