# organization-context.yaml - FILLABLE ORGANIZATION_CONTEXT read by the backend at runtime (SubtypeKnowledgeLoader).
# Everything unknown is `null` = UNKNOWN. Nothing here is guessed. Fill a value only when it is true for this organization:
#   authority.<id>: true -> that role is granted/available;  false -> explicitly NOT available;  null -> unknown
#   capability.<cap>: true -> the control exists and the runbook step can be performed with it; false -> explicitly unsupported; null -> unknown
#       (null keeps steps role-level with the TOOL_MAPPING_REQUIRED flag in platform_neutral mode, or UNSUPPORTED in strict mode)
# Override the file location with VIGIX_ORG_CONTEXT_FILE. Repository search (2026-10-08) found NO EDR / firewall / WAF / IdP / mail /
# database / secret-manager / RMM configuration, so all of it is unknown. Asset criticality comes from resources/assets/asset-criticality-catalog.yaml.

status: PARTIAL
authority:
  ir_execute: true          # VIGIX workflow: IR_TEAM decides and executes every Response Ticket (SOC never executes)

  ir_emergency: null
  dba: null
  business_authority: null
  asset_owner: null
  change_approval: null
