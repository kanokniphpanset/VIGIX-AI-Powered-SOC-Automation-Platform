# Addresses / hosts / accounts that must NEVER be cut (break-glass, recovery, jump hosts, trusted IR access). Matching targets raise scope.cuts_approved_access.
approved_access: []
#  - {match: "10.0.9.5", note: "IR jump host"}
# Process images / tool names / scheduled-task names that are approved automation or security tooling. Matching targets raise scope.is_approved_automation.
approved_automation: []
# Approved RMM tools / registrations (trusted IR access). Matching C2-RMM targets are never contained.
trusted_rmm: []
# Where scoped network/web restrictions are enforced for a host (never inferred from Wazuh).
enforcement_points: []
#  - {host: "SRV-VPN-01", service: "SSH (22/TCP)", enforcement_point: "perimeter firewall FW-EDGE-1"}
# Identity provider / tenant scope used to complete account targets (Wazuh does not carry it).
identity: null
#  {provider: "corp-idp", tenant_or_scope: "corp"}

# Named contacts / queues for authority roles (shown to users ONLY when filled; nothing here is guessed). Example:
